<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>存摺記帳</title>
<meta name="description" content="個人記帳 PWA，支援多帳戶、多幣別、預算、分期與統計。">
<meta name="theme-color" content="#FFF9E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="存摺記帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: passbook — single paper column (rail nav on desktop), ruled rows, mono figures, seal-red wordmark */
:root{
  --bg:#E9EEEB; --paper:#FBFCFA; --paper2:#F3F6F4; --ink:#1E2940; --muted:#677284; --rule:#D3DBD6;
  --accent:#2A4B7C; --accent-ink:#FFFFFF; --seal:#B5322A; --gain:#1C7656; --warn:#B7791F;
  --shadow:0 10px 30px rgba(30,41,64,.14);
  --c0:#D9653B; --c1:#2F7FBF; --c2:#3E9B6E; --c3:#8C5BB8; --c4:#C9A227; --c5:#C24D7A;
  --c6:#3B9AA6; --c7:#7A8B3A; --c8:#9C6B4A; --c9:#5865C9; --c10:#D0703A; --c11:#6E7F8F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-app="dark"]{
  --bg:#0F141B; --paper:#171E28; --paper2:#1D2532; --ink:#E5E9EF; --muted:#8E98A8; --rule:#2A3442;
  --accent:#8EAEE3; --accent-ink:#0F141B; --seal:#EE7B6E; --gain:#5EC79C; --warn:#E3B04B;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --c0:#EE8A62; --c1:#6AAEE6; --c2:#6CC79A; --c3:#B48BE0; --c4:#E2C25A; --c5:#E57BA5;
  --c6:#67C3CE; --c7:#A9BA63; --c8:#C99A78; --c9:#8D97EC; --c10:#EE9B61; --c11:#9AAABA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{overflow-x:clip}
body{font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}   /* 全站禁止選取／長按選單；輸入框下面個別開放 */
input,textarea,code{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}   /* code：Firestore 網址／UID／API 範例等給使用者複製的參考文字 */
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.neg{color:var(--seal)} .pos{color:var(--gain)} .mut{color:var(--muted)}
.shell{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;min-height:56px}
.top h1{margin:0;font:600 20px/1.2 var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.ibtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn:hover{background:var(--paper2)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.monthnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.monthnav h1{flex:none}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;font:700 15px/1 var(--serif);transform:rotate(-4deg);flex:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.add{color:var(--accent-ink)}
.tab.add span.plus{width:48px;height:48px;margin-top:-18px;border-radius:16px;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.tab.add svg{stroke:var(--accent-ink);stroke-width:2.4}
@media (min-width:960px){
  .tabbar{top:0;right:auto;width:92px;border-top:0;border-right:1px solid var(--rule);grid-template-columns:1fr;grid-auto-rows:min-content;gap:10px;padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px max(0px,env(safe-area-inset-left,0px));align-content:start}
  .tab{font-size:12px}
  .tab.add{order:-1;margin-bottom:12px}
  .tab.add span.plus{margin-top:0}
  .shell{padding-left:calc(92px + 32px);max-width:calc(780px + 124px);padding-bottom:48px}
}

/* summary */
.sum{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;display:grid;gap:12px}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumrow div{min-width:0}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.big{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.huge{font-size:32px;font-weight:600;line-height:1.15;word-break:break-all}
.bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--gain);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--seal)}
.note{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--rule);font-size:13.5px}
.note b{font-weight:600}
.note .grow{flex:1;min-width:0}
.note.alert{border-color:var(--seal)}
.stack{display:grid;gap:12px}
.mt{margin-top:16px}

/* ledger list */
.day{margin-top:14px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;background:var(--paper2);border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--muted)}
.dayh .num{font-size:12.5px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--paper2)}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-size:15px;white-space:nowrap}
.row .amt small{display:block;font-size:11px;color:var(--muted)}
.row.future{opacity:.62}
.row.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font:600 15px/1 var(--sans);background:var(--c11);flex:none}
.badge.tr{background:var(--accent);color:var(--accent-ink)}
.badge.debt{background:var(--warn)}
.badge.sys{background:var(--c11)}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:99px;border:1px solid var(--rule);color:var(--muted);margin-left:6px;vertical-align:1px;letter-spacing:.04em}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.more-btn{display:block;margin:14px auto 0;border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:8px 18px;color:var(--accent)}

/* passbook (account detail) */
.pb{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-top:14px}
.pbh,.pbr{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(76px,auto) minmax(84px,auto);gap:8px;padding:8px 14px;align-items:center}
.pbh{background:var(--paper2);font-size:11.5px;color:var(--muted);letter-spacing:.08em;border-bottom:1px solid var(--rule)}
.pbr{border-bottom:1px solid var(--rule);cursor:pointer}
.pbr:hover{background:var(--paper2)}
.pbr:last-child{border-bottom:0}
.pbr .d{font-size:12px;color:var(--muted)}
.pbr .m{min-width:0}
.pbr .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbr .m small{font-size:11.5px;color:var(--muted)}
.pbh span:nth-child(n+3),.pbr .a,.pbr .b{text-align:right;white-space:nowrap}
.pbr .b{color:var(--muted)}
@media (max-width:420px){.pbh,.pbr{grid-template-columns:52px minmax(0,1fr) auto}.pbh span:nth-child(4),.pbr .b{display:none}.pbr .a small{display:block;font-size:11px;color:var(--muted)}}
@media (min-width:421px){.pbr .a small{display:none}}

/* accounts */
.grp{margin-top:18px}
.grph{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);letter-spacing:.08em;padding:0 4px 6px}
.pfh{width:100%;background:var(--card,var(--paper));border:1px solid var(--line,#e5e5e5);border-radius:14px;padding:14px 16px;margin-bottom:8px;font-size:15px;color:inherit;letter-spacing:0;cursor:pointer}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li:hover{background:var(--paper2)}
.li .grow{flex:1;min-width:0}
.li .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;font-size:12px;color:var(--muted)}
.li .r{text-align:right;white-space:nowrap}
.chev{color:var(--muted);flex:none}

/* segmented, chips */
.seg{display:inline-flex;background:var(--paper2);border:1px solid var(--rule);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* buttons, forms */
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:11px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.fill>*{flex:1}
.btns.editor-actions{flex-wrap:nowrap}
.editor-actions>.btn{flex:1 1 0;min-width:0;min-height:44px;padding-inline:6px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.in{width:100%;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:16px}
.in:focus{border-color:var(--accent);outline:none}
select.in{appearance:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
details.adv summary{cursor:pointer;color:var(--accent);font-size:13.5px;padding:4px 0}
details.adv[open] summary{margin-bottom:8px}
.amtbox{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding:6px 2px}
.amtbox .cur{font:600 14px var(--mono);color:var(--muted)}
.amtbox input{flex:1;min-width:0;border:0;background:none;font:600 34px/1.1 var(--mono);text-align:right;outline:none;padding:0}
.amtbox .ev{font:13px var(--mono);color:var(--muted)}
.catrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.catbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);border-radius:10px}
.catbtn .badge{width:40px;height:40px;opacity:.55}
.catbtn.on{color:var(--ink);font-weight:600}
.catbtn.on .badge{opacity:1;outline:2px solid var(--ink);outline-offset:2px}
.sprow{align-items:flex-start;gap:10px}.sptile{width:70px}.sptile .badge{width:52px;height:52px;font-size:24px;opacity:1}.sptile .spn{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sptile b{font-weight:600;color:var(--pos,#3a9a4a);font-size:12.5px}.sptot{cursor:default}.sptot .badge{outline:0}.spsep{flex:none;width:1px;align-self:stretch;margin:6px 0 22px;background:var(--rule)}.spadd{background:var(--paper2)!important;color:var(--muted);font-size:28px}.amtbox{position:relative}.amtplus{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--paper2);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.qrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:6px}.qrow::-webkit-scrollbar{display:none}.qrow .chip{flex:none}
.sphint{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.spedit{margin-top:8px;padding:10px;border:1px solid var(--rule);border-radius:12px;display:grid;gap:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.sheet .sh h2{margin:0;flex:1;font:600 17px var(--serif)}
.sheet .sb{grid-template-columns:minmax(0,1fr);overflow-x:hidden;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);border-radius:18px;max-height:88vh;animation:fade .15s}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
.toast{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
@media (min-width:960px){.toast{bottom:28px}}

/* charts */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin-top:14px;min-width:0}
.card h3{margin:0 0 10px;font:600 15px var(--serif);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font:12px var(--sans);color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .axc{fill:var(--muted);font:11px var(--sans)}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .gl0{stroke:var(--muted);stroke-width:1}
.chart .be{fill:var(--seal)} .chart .bi{fill:var(--gain)} .chart .bh{opacity:1} .chart .bd{opacity:.72}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .ln.nw{stroke:#2f6fdb}.chart .md.nw{fill:#2f6fdb}
.chart .dt{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.chart .ct{fill:var(--ink);font:600 17px var(--mono)}
.chart .cs{fill:var(--muted);font:11px var(--sans)}
.donutwrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:440px){.donutwrap{grid-template-columns:1fr}.donutwrap svg{max-width:200px;margin:0 auto}}
.legend{display:grid;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 4px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.lg:hover{background:var(--paper2)}
.lg i{width:10px;height:10px;border-radius:3px}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .p{color:var(--muted);font-size:12px}
.legend-mini{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend-mini i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* welcome */
.hero{padding-block:28px 8px;display:grid;gap:14px}
.hero h2{font:700 30px/1.25 var(--serif);margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.feat div{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:13.5px}
.feat b{display:block;font-family:var(--serif);font-size:14.5px;margin-bottom:2px}
.prog{font:13px var(--mono);color:var(--muted)}
.hide{display:none!important}
.sel-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:15}
.sel-bar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (min-width:960px){.sel-bar{bottom:16px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.kv>div{min-width:0}
.kv .v{font-size:16px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:6px;align-items:center}
textarea.in{min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.hint code{font-family:var(--mono);font-size:12px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}

.sheet .sb>*{min-width:0}

/* ---------- v1.6 首頁月曆（MOZE 風格） ---------- */

.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}

.cd{border:0;background:none;height:48px;display:grid;place-items:center;padding:0;color:var(--muted);opacity:.5;position:relative}
.cd>span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:2px solid transparent}

.cd.h{color:var(--ink);opacity:1}
.cd.sa{color:var(--gain)} .cd.su{color:var(--seal)}
.cd.o{opacity:.25}
.cd.td>span{font-weight:700}
.cd.td:not(.on)::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cd.on{opacity:1}
.cd.on>span{border-color:var(--accent);color:var(--ink)}
.cal-handle{display:block;margin:4px auto 6px;border:0;background:none;padding:8px 30px}
.cal-handle i{display:block;width:46px;height:5px;border-radius:99px;background:var(--rule)}
.pcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(30,41,64,.06)}
.pcard .t{font-size:18px;font-weight:600}
.pcard .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.pc2{row-gap:2px}.pcard.pc2 .hb{grid-row:1/3}.pcard.pc2 .s{grid-column:2/4;grid-row:2}  /* 本月收支放第二列、橫跨到右側，完整金額不截斷 */
.pcard .amt{align-self:start;font-size:16px;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.pcard .amt i{font-style:normal;color:var(--muted);font-size:12px}
.hb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;background:color-mix(in srgb,var(--bc,var(--c11)) 22%,var(--paper));flex:none}
.hb.txt{background:var(--bc,var(--c11));color:#fff;font:600 18px/1 var(--sans)}
.hb.pj{--bc:var(--c11)}
.pcard .hb{width:52px;height:52px;font-size:26px}
.hlist{margin-top:6px}
.row.hrow{grid-template-columns:48px minmax(0,1fr) auto;gap:12px;padding:11px 4px;border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent);border-radius:0}

.row.hrow .t{font-size:16.5px}
.row.hrow .s{font-size:12.5px}

.row.hrow .amt small{font-size:11px}
.apill{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 11.5px/1.2 var(--sans);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:99px;padding:3px 10px}

  .tab .tl{display:none}

  .tab.add span.plus{width:66px;height:66px;margin-top:-30px;border-radius:50%;background:var(--paper);border:3px solid var(--accent);box-shadow:0 4px 14px rgba(30,41,64,.16)}

}
.srt{display:grid;gap:6px;margin-top:10px}
#projList .li{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#projList .li.drag{box-shadow:var(--shadow);position:relative;z-index:2;background:var(--paper)}.proj-h{font-size:20px;line-height:1;color:var(--muted);padding:4px 2px 4px 0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}

.hdList .li{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.hdList .li.drag{box-shadow:var(--shadow);position:relative;z-index:2;background:var(--paper)}.hd-h{font-size:20px;line-height:1;color:var(--muted);padding:4px 2px 4px 0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}.cat-h{font-size:20px;line-height:1;color:var(--muted);padding:4px 6px 4px 0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.subrow{cursor:pointer}.subrow.drag{box-shadow:var(--shadow);position:relative;z-index:2;background:var(--paper)}.sub-h{font-size:16px;line-height:1;color:var(--muted);padding:2px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.srt-row{-webkit-user-select:none;user-select:none;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:6px 8px}
.srt-row.drag{box-shadow:var(--shadow);border-color:var(--accent);position:relative;z-index:2}

.srt-row .grow{flex:1;min-width:0}
.grpr .gcar{display:inline-grid;vertical-align:-3px;margin-left:4px;color:var(--muted);transition:transform .15s}

.gkids{margin:0 0 4px 22px;border-left:2px solid var(--rule);padding-left:8px}

.gkids .hb{width:36px;height:36px;font-size:18px}
.gkids .row.hrow .t{font-size:15px}
.gkids .row.hrow .amt{font-size:15px}
@keyframes slideL{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
.hlist.slide-l{animation:slideL .18s ease-out}.hlist.slide-r{animation:slideR .18s ease-out}
.shell.home{height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:none;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
body:has(.shell.home){overflow:hidden;height:100dvh}
.shell.home>*{flex:none}
.shell.home>.hlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.dask{flex-wrap:wrap;margin-bottom:10px}.dask .btns{width:100%;margin-top:6px}
button.dtitle{border:0;background:none;padding:0;color:inherit}
.dpick{cursor:pointer}

.shell.home .hlist,.shell.home .pcard{touch-action:pan-y}
.shell.home .hlist{transition:transform .12s ease-out}
.appver{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 6px}
.row.hrow .s.shp{margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- v1.8 圖示與精簡明細列 ---------- */
.hb{background:var(--bc,var(--c11))}
.hb.sm{width:34px;height:34px;font-size:18px}
.pcard .hb.pj{background:color-mix(in srgb,var(--c11) 25%,var(--paper))}
.row.hrow{padding:13px 4px;align-items:center}

.row.hrow .amt .num,.pcard .amt,.dtitle h1{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:0}
.row.hrow .amt{font-size:18px}
.sublist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.subrow{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:6px 8px;text-align:left;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- v1.8 清爽版配色與字體（比照常見記帳 App 的乾淨風格） ---------- */
:root{--serif:var(--sans);--mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang TC","Noto Sans TC",sans-serif}
:root:not([data-app="dark"]){--bg:#FFF9E0;--paper:#FFFDF2;--paper2:#FFF3CC;--ink:#2B2D36;--muted:#8A8472;--rule:#EFE4BC;--accent:#57C263;--accent-ink:#FFFFFF;--seal:#D8574F;--gain:#6DB23E;--shadow:0 8px 26px rgba(40,44,60,.10)}
.num{font-variant-numeric:tabular-nums}
h1{font-weight:700}
.cd>span{font-size:19px;font-weight:400}
.cd.on>span{border-width:3px}
.cal-wd span{font-size:13.5px}
.apill{color:#3E9FB8;border-color:#8CCBDA}
.pills{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;max-width:100%}.ppill{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 11.5px/1.2 var(--sans);color:#E08A3C;border:1px solid #F0B98A;border-radius:99px;padding:3px 10px}
:root[data-app="dark"] .ppill{color:#F0A868;border-color:#8A5A32}
:root[data-app="dark"] .apill{color:#7CCBDD;border-color:#3F7F8E}
.pcard{border:0;box-shadow:0 2px 10px rgba(40,44,60,.05)}
.row.hrow{border-bottom:0}
@media (max-width:959px){.tab.add span.plus{border-width:4px;width:70px;height:70px;margin-top:-34px}.tab.add svg{stroke:var(--ink)}}
.seg.dims{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}.seg.dims::-webkit-scrollbar{display:none}.seg.dims button{white-space:nowrap;flex:none}
.seg.full{display:flex}.seg.full button{flex:1}
.li.sch small{display:block}
.pbar{height:6px;border-radius:99px;background:var(--paper2);margin:6px 0 4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* v2.0.37 列表：金額欄固定 7 位數寬，品名可延伸到金額旁；專案/帳戶標籤移到第二列靠右 */
.row.hrow,.gkids .row.hrow{grid-template-columns:48px minmax(0,1fr) minmax(98px,auto);column-gap:10px;row-gap:3px}
.gkids .row.hrow{grid-template-columns:36px minmax(0,1fr) minmax(98px,auto)}
.row.hrow>.amt,.row.hrow .hlabels{display:contents}
.row.hrow>.amt>.num{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap}
.row.hrow>.amt>.hlabels>small{grid-column:3;grid-row:2;justify-self:end;white-space:nowrap}
.row.hrow>.amt>.hlabels>.pills,.row.hrow>.amt>.apill{grid-column:2/4;grid-row:2;justify-self:end;max-width:100%}
.row.hrow>.amt>.apill{max-width:none}
.row.hrow:has(>.amt>.hlabels>.pills)>:first-child,.row.hrow:has(>.amt>.apill)>:first-child{grid-row:1/3;align-self:center}
.row.hrow>div[style*="min-width:0"]{grid-column:2;grid-row:1;align-self:center}
.row.hrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trl{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 6px;margin-top:-4px;grid-column:2/-1;min-width:0}.row.hrow:has(>.trl)>:first-child{grid-row:1/3;align-self:center}.trl .apill{max-width:none;overflow:visible}.trl .arr{color:var(--muted);font-size:13px}
/* 首頁交易與多類別明細共用兩列排列，金額保留七位數的寬度。 */
:root{--home-row-height:62px;--group-row-height:calc(var(--home-row-height) + 3pt)}
:is(.shell.home>.hlist,.gl)>.hrow{height:var(--row-height,var(--home-row-height));grid-template-columns:42px minmax(0,1fr) max-content;grid-template-rows:22px 22px;align-content:center;gap:5px 8px;padding:6px 4px}
:is(.shell.home>.hlist,.gl)>.hrow>.hb{width:42px;height:42px;font-size:22px;grid-row:1/3;align-self:center}
:is(.shell.home>.hlist,.gl)>.hrow>div[style*="min-width:0"]{display:contents}
:is(.shell.home>.hlist,.gl)>.hrow .t{grid-area:1/2;min-width:0;line-height:22px}
:is(.shell.home>.hlist,.gl)>.hrow .s{grid-area:2/2/3/4;min-width:0;line-height:18px}
:is(.shell.home>.hlist,.gl)>.hrow>.amt>.num{width:calc(7ch + 1.1em);text-align:right;line-height:22px}
:is(.shell.home>.hlist,.gl)>.hrow .hlabels{display:flex;align-items:center;gap:4px;grid-area:2/2/3/4;justify-self:end;max-width:100%;min-width:0}
:is(.shell.home>.hlist,.gl)>.hrow:has(.s) .hlabels{max-width:66%}
:is(.shell.home>.hlist,.gl)>.hrow:has(.hlabels) .s{max-width:32%}
:is(.shell.home>.hlist,.gl)>.hrow .hlabels>small{overflow:hidden;text-overflow:ellipsis}
:is(.shell.home>.hlist,.gl)>.hrow .hlabels>.pills{flex-wrap:nowrap;min-width:0}
:is(.shell.home>.hlist,.gl)>.hrow .hlabels>.pills>*{min-width:0}
:is(.shell.home>.hlist,.gl)>.hrow>.trl{grid-row:2;flex-wrap:nowrap;margin-top:0}
:is(.shell.home>.hlist,.gl)>.hrow>.trl .apill{min-width:0;overflow:hidden}
:is(.shell.home>.hlist,.gl)>.hrow:has(>.trl)>div[style*="min-width:0"]{display:flex;align-items:baseline;gap:5px}
:is(.shell.home>.hlist,.gl)>.hrow:has(>.trl) .t{flex:none}
.shell.home>.hlist>.hrow.grpr,.gl>.hrow{--row-height:var(--group-row-height)}
/* 計算機鍵盤 */

/* ---------- v2.0.40 MOZE 風格「記一筆」 ---------- */
.sheet.ed{top:0;bottom:0;max-height:none;height:100%;border-radius:0}
.sheet.ed .sh{padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:0}

function evalAmt(src){
  let s=String(src??'').replace(/[,\s$]/g,'').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/＋/g,'+').replace(/－/g,'-');
  if(!s)return NaN;let i=0;
  const fac=()=>{if(s[i]==='-'){i++;return-fac()}if(s[i]==='+'){i++;return fac()}if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const term=()=>{let v=fac();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const f=fac();v=o==='*'?v*f:v/f}return v};
  const expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const t=term();v=o==='+'?v+t:v-t}return v};
  try{const v=expr();if(i<s.length||!isFinite(v))return NaN;return r2(v)}catch(e){return NaN}
}

function addMonths(dt,n,anchorDay){const[y,m,d]=dt.split('-').map(Number);const t=new Date(y,m-1+n,1);const dd=Math.min(anchorDay||d,daysIn(t.getFullYear(),t.getMonth()+1));return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(dd)}

class LocalWriteError extends Error {}
function localWrite(write, message){
  const pending=Promise.resolve().then(()=>{
    if(DB.mem)throw new Error('IndexedDB 無法使用');
    return write();
  }).catch(cause=>{
    toast(message);
    throw new LocalWriteError(message,{cause});
  });
  // 部分顯示偏好採背景儲存，await 同一個 Promise 仍會收到失敗。
  pending.catch(()=>{});
  return pending;
}

function saveKV(k,replacement){
  const syncedKey=SYNC_KEYS.includes(k);
  const value=structuredClone(replacement===undefined?S[k]:replacement);
  let u;
  const saved=localWrite(()=>DB.run(['kv'],tx=>{
      const store=tx.objectStore('kv');
      store.put(value,k);
      if(syncedKey){
        const request=store.get('kvu');
        request.onsuccess=()=>{
          u=Math.max(Date.now(),(request.result?.[k]||0)+1,(S.kvu[k]||0)+1);
          store.put({...request.result,[k]:u},'kvu');
        };
      }
    }),'設定未能儲存到此裝置');
  const pending=saved.then(()=>{
    if(replacement!==undefined)S[k]=replacement;
    if(syncedKey){
      S.kvu[k]=u;
      if(window.Cloud)Cloud.pushKV(k,value,u);
    }
  });
  pending.catch(()=>{});
  return pending;
}

function recompute(){
  if(S.ready)holdSyncSoon();

  D.acct=new Map(S.accts.map(a=>[a.id,a]));
  const bal=new Map(S.accts.map(a=>[a.id,a.init||0]));
  const live=[],pairs=new Map(),groups=new Map(),whos=new Map(),projs=new Map();
  for(const r of S.recs){if(r.x)continue;live.push(r);
    if(r.dt<=td&&bal.has(r.a))bal.set(r.a,bal.get(r.a)+val(r));

    if(r.p)projs.set(r.p,(projs.get(r.p)||0)+1);
  }
  for(const[k,v]of bal)bal.set(k,r2(v));
  live.sort((a,b)=>a.dt<b.dt?1:a.dt>b.dt?-1:a.tm<b.tm?1:a.tm>b.tm?-1:(b.o||0)-(a.o||0));
  D.live=live;D.bal=bal;D.pairs=pairs;D.groups=groups;
  D.whos=[...whos.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);

let recordWrites=Promise.resolve();
function mutate(add=[],del=[],ruleUpdate){
  const additions=add.map(r=>({...r}));
  const deletions=[...del];
  const pending=recordWrites.then(()=>{
    const out=new Map(),extra=[];
    for(const r of additions){
      const old=S.byId.get(r.id);
      r.u=Math.max(Date.now(),(old?.u||0)+2);
      if(old?.dt&&r.dt&&old.dt.slice(0,7)!==r.dt.slice(0,7)){
        extra.push({id:r.id,x:1,u:r.u-1,dt:old.dt});
      }
      out.set(r.id,r);
    }
    for(const id of deletions){
      const old=out.get(id)||S.byId.get(id);
      if(old)out.set(id,{id,x:1,u:Math.max(Date.now(),(old.u||0)+1),dt:old.dt});
    }
    if(!out.size&&!ruleUpdate)return;
    const rows=[...out.values()];
    const rules=ruleUpdate?S.rules.map(rule=>rule.id===ruleUpdate.id?ruleUpdate:rule):null;
    let ruleVersion;
    const write=rules?()=>DB.run(['rec','kv'],tx=>{
      const rec=tx.objectStore('rec'),kv=tx.objectStore('kv');
      rows.forEach(row=>rec.put(row));
      kv.put(rules,'rules');
      const request=kv.get('kvu');
      request.onsuccess=()=>{
        ruleVersion=Math.max(Date.now(),(request.result?.rules||0)+1,(S.kvu.rules||0)+1);
        kv.put({...request.result,rules:ruleVersion},'kvu');
      };
    }):()=>DB.putRecs(rows);
    return localWrite(write,'記錄未能寫入此裝置').then(()=>{
      if(rules){S.rules=rules;S.kvu.rules=ruleVersion}
      for(const r of rows){
        const old=S.byId.get(r.id);
        if(old){Object.keys(old).forEach(k=>delete old[k]);Object.assign(old,r)}
        else{S.recs.push(r);S.byId.set(r.id,r)}

      ensureCats();recompute();
      // 本機交易已完成。雲端上傳由 Cloud 的佇列另行處理。
      if(window.Cloud){
        Cloud.pushRecs(extra.concat(rows));
        if(rules)Cloud.pushKV('rules',rules,ruleVersion);
      }
    });
  });
  recordWrites=pending.catch(()=>{});
  return pending;
}

/* ================= recurring & installments ================= */
function occDate(rule,k){
  const iv=rule.iv||1;
  if(rule.fq==='D')return addDays(rule.start,k*iv);
  if(rule.fq==='W')return addDays(rule.start,k*7*iv);
  if(rule.fq==='Y')return addMonths(rule.start,k*12*iv,+rule.start.slice(8));
  if(rule.fq==='M'&&rule.md&&rule.md.length){const L=rule.md.length,j=k+(rule.m0||0);return addMonths(rule.start.slice(0,8)+'01',Math.floor(j/L)*iv,rule.md[j%L])}
  return addMonths(rule.start,k*iv,+rule.start.slice(8));
}

function isOffDay(d){const w=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8)).getDay();if(w===0||w===6)return true;const y=d.slice(0,4);return y==='2026'||y==='2027'?TW_HOL.has(d):TW_FIXED.has(d.slice(5))}
/* 匯率：前一個營業日臺灣銀行「現金買入」收盤價。資料由 GitHub Actions 每天抓臺銀牌告後存成 rates.json */
const BOT_URL='https://raw.githubusercontent.com/taya20081-stack/ledger/main/rates.json';
async function botRates(force){const td=TODAY();if(!force&&S.rates.botFor===td)return false;
  try{const res=await fetch(BOT_URL+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)return false;const j=await res.json();const ds=Object.keys(j.d||{}).filter(d=>d<td).sort();const d=ds[ds.length-1];if(!d)return false;
    const row=j.d[d];let n=0;for(const c in row){const v=+row[c];if(v>0&&c!=='TWD'){S.rates.r[c]=v;n++}}if(!n)return false;
    S.rates.src='臺灣銀行現金買入 '+d.slice(5).replace('-','/')+' 收盤';S.rates.at=d;S.rates.botFor=td;S.rates.u=Date.now();await saveKV('rates');recompute();return true}catch(e){return false}}

async function renProj(old,nv){
  const merge=D.live.some(r=>r.p===nv);
  const rs=D.live.filter(r=>r.p===old).map(r=>({...r,p:nv}));
  if(rs.length)await mutate(rs);
  const fix=f=>{
    let hit=false;
    if(f?.p===old){f.p=nv;hit=true}
    for(const x of f?.splits||[]){if(x.p===old){x.p=nv;hit=true}}
    return hit;
  };
  const update=async key=>{
    const items=structuredClone(S[key]);
    let count=0;
    for(const item of items){if(fix(item.fs)){item.u=Date.now();count++}}
    if(count)await saveKV(key,items);
    return count;
  };
  const nr=await update('rules');
  await update('tpls');
  const settings={...S.settings};
  let changed=false;
  for(const k of ['projDone','projOpen']){
    const m={...(settings[k]||{})};
    if(Object.hasOwn(m,old)){if(!Object.hasOwn(m,nv))m[nv]=m[old];delete m[old];settings[k]=m;changed=true}
  }

}

function ruleOf(r){const m=/^(.+)_(\d+)_\d+$/.exec(r&&r.id||'');if(!m)return null;const rule=S.rules.find(x=>x.id===m[1]&&x.fq!=='I');return rule?{rule,k:+m[2]}:null}

function ruleNext(rule){if(!rule.on)return'';const td=TODAY();for(let k=0;k<2000;k++){if(rule.cnt&&k+(rule.off||0)>=rule.cnt)return'';const d=ruleOccDate(rule,k);if(rule.end&&d>rule.end)return'';if(d>td){if(k<rule.done){const x=S.byId.get(rule.id+'_'+k+'_0');if(!x||x.x)continue}return d}}return''}

let ruleWrites=Promise.resolve();
function runRules(){
  const pending=ruleWrites.then(postDueRules);
  ruleWrites=pending.catch(()=>{});
  return pending;
}
async function postDueRules(){
  const td=TODAY(),to=addDays(td,RULE_AHEAD);const add=[],advances=[];let due=0;
  for(const current of S.rules){
    const rule={...current};
    if(rule.fq==='I'||!rule.on)continue;
    let guard=0;
    while(guard++<800){
      if(rule.cnt&&rule.done+(rule.off||0)>=rule.cnt)break;
      const d=ruleOccDate(rule,rule.done);
      if(d>to||(rule.end&&d>rule.end))break;
      add.push(...ruleBuild(rule,rule.done).filter(r=>!S.byId.get(r.id)||S.byId.get(r.id).x));
      if(d<=td)due++;
      rule.done++;
    }
    current.next=ruleNext(current);
    if(rule.done!==current.done)advances.push({current,done:rule.done,next:ruleNext(rule)});
  }
  if(!advances.length)return;
  if(add.length)await mutate(add);
  const previousProgress=new Map(advances.map(({current})=>[current,{done:current.done,next:current.next,u:current.u}]));
  for(const {current,done,next} of advances)Object.assign(current,{done,next,u:Date.now()});
  try{await saveKV('rules')}catch(e){
    // 進度可重試，已提交的記錄由固定 ID 辨識。
    for(const {current,done} of advances){
      const previous=previousProgress.get(current);
      if(current.done===done)Object.assign(current,previous);
    }
    throw e;
  }
  if(add.length&&due)toast('已自動記入 '+due+' 筆週期記錄');
}
function amortize(total,n,ratePct){
  const i=ratePct/100/12;const pmt=i?total*i/(1-Math.pow(1+i,-n)):total/n;
  let rem=total;const out=[];
  for(let k=0;k<n;k++){let int=Math.round(rem*i);let pr=k===n-1?Math.round(rem):Math.round(pmt-rem*i);if(!i)pr=k===n-1?Math.round(rem):Math.round(total/n);if(i&&k===n-1)int=Math.max(0,Math.round(pmt)-pr);rem-=pr;out.push({pr,int})}
  return out;
}

async function renameSub(k,cn,old,nv){
  const cat=S.cats[k].find(q=>q.n===cn);
  if(!cat||!cat.subs.includes(old)||old===nv)return 0;
  const t=k==='exp'?'支出':'收入';
  const rows=D.live.filter(r=>r.t===t&&r.c===cn&&r.s===old).map(r=>({...r,s:nv}));
  if(rows.length)await mutate(rows);
  const icons={...(S.settings.icons||{})};
  const icon=icons[cn+'|'+old];
  if(icon){
    delete icons[cn+'|'+old];
    icons[cn+'|'+nv]=icon;
    await saveKV('settings',{...S.settings,icons});
  }
  const rules=structuredClone(S.rules);
  let changed=false;
  for(const rule of rules){
    const f=rule.fs;
    if(!f)continue;
    const matches=[f,...(f.splits||[])].filter(x=>x.c===cn&&x.s===old);
    for(const x of matches)x.s=nv;
    if(matches.length){rule.u=Date.now();changed=true}

  if(changed)await saveKV('rules',rules);
  const cats=structuredClone(S.cats);
  const subs=cats[k].find(q=>q.n===cn).subs;
  const at=subs.indexOf(old);
  if(at>=0){
    if(subs.includes(nv))subs.splice(at,1);else subs[at]=nv;
    cats.u=Date.now();
    await saveKV('cats',cats);
  }
  return rows.length;
}

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.length>1||r[0]!=='');
}
function guessGroup(name,cur){
  if(/信用卡/.test(name))return'信用卡';
  if(/悠遊|一卡通|iPass|icash|Line ?Pay|街口|全支付|西瓜|Suica|PayPay|Pi錢包|台灣Pay/i.test(name))return'電子支付';
  if(/證券|股票|基金|投資|複委託/.test(name))return'投資';
  if(/錢包|現金|^零錢/.test(name))return cur==='TWD'?'現金':'外幣';
  if(cur!=='TWD')return'外幣';
  return'銀行';
}
function mozeToData(text,existingAccts=[]){
  const rows=parseCSV(text);const H=rows.shift();if(!H)throw new Error('檔案是空的');
  const ix=n=>H.indexOf(n);const need=['帳戶','幣種','記錄類型','金額','日期'];
  for(const n of need)if(ix(n)<0)throw new Error('找不到欄位「'+n+'」，請確認是正確格式的 CSV');
  const I={a:ix('帳戶'),cur:ix('幣種'),t:ix('記錄類型'),c:ix('主類別'),s:ix('子類別'),m:ix('金額'),f:ix('手續費'),d:ix('折扣'),n:ix('名稱'),sh:ix('商家'),dt:ix('日期'),tm:ix('時間'),p:ix('專案'),ds:ix('描述'),tg:ix('標籤'),w:ix('對象')};
  const g=(r,k)=>I[k]>=0?(r[I[k]]??'').trim():'';
  const accts=existingAccts.map(a=>({...a}));const byName=new Map(accts.map(a=>[a.name,a]));
  const getA=(name,cur)=>{let a=byName.get(name);if(!a){a={id:uid(),name,cur:cur||'TWD',grp:guessGroup(name,cur||'TWD'),init:0,arch:0,order:accts.length,u:Date.now()};accts.push(a);byName.set(name,a)}return a};
  const recs=[];let o=0;const inits=[];
  for(const r of rows){const t=g(r,'t');const name=g(r,'a');if(!name)continue;const a=getA(name,g(r,'cur'));
    if(t==='初始金額'){inits.push([a,parseFloat(g(r,'m'))||0]);continue}
    const dt=g(r,'dt').replace(/\//g,'-').replace(/^(\d{4})-(\d)-/,'$1-0$2-').replace(/-(\d)$/,'-0$1');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))continue;
    let n=g(r,'n');if(n==='CATEGORY_ADJUSTMENT')n='';
    const w=g(r,'w');const rc=g(r,'cur')||a.cur;
    recs.push({id:uid(),a:a.id,t,c:g(r,'c'),s:g(r,'s'),m:parseFloat(g(r,'m'))||0,f:parseFloat(g(r,'f'))||0,d:parseFloat(g(r,'d'))||0,
      n,sh:g(r,'sh'),dt,tm:(g(r,'tm')||'00:00').slice(0,5),p:g(r,'p'),ds:g(r,'ds'),tg:g(r,'tg'),w,k:'',g:'',o:o++,u:Date.now(),...(rc!==a.cur?{cu:rc,xr:+((fxOn(rc,dt)/fxOn(a.cur,dt))||1).toPrecision(6)}:{})});
  }
  // pair transfers by date+time, exact amount first
  const outs=new Map(),ins=new Map();
  recs.forEach(r=>{if(r.t==='轉出'||r.t==='轉入'){const key=r.dt+' '+r.tm;const m=r.t==='轉出'?outs:ins;if(!m.has(key))m.set(key,[]);m.get(key).push(r)}});
  let paired=0;
  for(const[key,os]of outs){const is=(ins.get(key)||[]).slice();
    for(const o1 of os){let j=is.findIndex(x=>Math.abs(x.m)===Math.abs(o1.m)&&x.a!==o1.a);if(j<0)j=is.findIndex(x=>x.a!==o1.a);if(j<0)continue;const k=uid();o1.k=k;is[j].k=k;is.splice(j,1);paired++}}
  return{accts,recs,inits,paired,fx:recs.filter(r=>r.cu).length};
}
function csvCell(v){v=v==null?'':String(v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const numStr=v=>v?String(r2(v)):'0';
function toMozeCSV(list){
  const H=['帳戶','幣種','記錄類型','主類別','子類別','金額','手續費','折扣','名稱','商家','日期','時間','專案','描述','標籤','對象'];
  const lines=[H.join(',')];
  if(!list){for(const a of S.accts)lines.push([a.name,a.cur,'初始金額','','',numStr(a.init),'','','','','','','','','',''].map(csvCell).join(','));}
  const recs=(list||S.recs.filter(r=>!r.x)).slice().sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:a.tm<b.tm?-1:a.tm>b.tm?1:(a.o||0)-(b.o||0));
  for(const r of recs){const a=D.acct.get(r.a);if(!a)continue;
    const debt=r.t==='應收款項'||r.t==='應付款項';
    lines.push([a.name,r.cu||a.cur,r.t,r.c,r.s,numStr(r.m),numStr(r.f),numStr(r.d),r.t==='餘額調整'&&!r.n?'CATEGORY_ADJUSTMENT':(r.n||r.gn||''),r.sh,r.dt.replace(/-/g,'/'),r.tm,r.p,r.ds,r.tg,r.w].map(csvCell).join(','));}
  return'﻿'+lines.join('\r\n')+'\r\n';
}

async function clearRecords(){ // replace-all semantics; keeps tombstones when cloud sync is on

async function saveFile(name,mime,content){
  const blob=new Blob([content],{type:mime});
  if(window.claude&&window.claude.use){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==='declined')return false;toast('無法下載：'+(e&&e.message||e));return false}}}
  try{const file=new File([blob],name,{type:mime});
    if(isMobile()&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;
}

async function importMoze(mode){

  showBusy('讀取 '+f.name+' …');
  try{
    const text=await readText(f);
    const res=mozeToData(text,mode==='replace'?[]:S.accts);
    let recs=res.recs;let skipped=0;
    if(mode==='replace'){await clearRecords();S.cats={exp:[],inc:[],u:Date.now()};S.rules=[];S.tpls=[];S.budgets={total:0,cats:{},u:Date.now()};S.settings.sample=0}
    else{const sig=r=>[r.a,r.t,r.m,r.dt,r.tm,r.n].join('|');const have=new Set(S.recs.filter(r=>!r.x).map(sig));const n0=recs.length;recs=recs.filter(r=>!have.has(sig(r)));skipped=n0-recs.length}
    for(const[a,v]of res.inits)if(mode==='replace'||!S.accts.find(x=>x.id===a.id))a.init=v;

    for(const[k,t]of[['exp','支出'],['inc','收入']]){S.cats[k].sort((a,b)=>(freq.get(t+'|'+b.n)||0)-(freq.get(t+'|'+a.n)||0));S.cats[k].forEach((c,i)=>{c.ci=i%11;c.subs.sort((x,y)=>(freq.get(t+'|'+c.n+'|'+y)||0)-(freq.get(t+'|'+c.n+'|'+x)||0))})}
    S.cats.u=Date.now();
    const curs=new Set(S.accts.map(a=>a.cur));curs.forEach(c=>{if(c!=='TWD'&&!S.rates.r[c])S.rates.r[c]=DEFAULT_RATES[c]||0});

// 多類別記錄的「大項名稱」：新版存在 gn；舊版是每個分項都被填成同一個名稱
/* 舊資料：獨立列項的海外交易手續費 → 併入同一時間、同帳戶的那筆支出 */
async function fixOsGroups(){const up=[];const byKey=new Map();
  for(const r of D.live)if(r.t==='支出'&&r.n!=='海外交易手續費'){const k=r.a+'|'+r.dt+'|'+r.tm;(byKey.get(k)||byKey.set(k,[]).get(k)).push(r)}
  for(const f of D.live){if(f.n!=='海外交易手續費'||f.g||!/^海外交易 1\.5%/.test(f.ds||''))continue;
    const ms=(byKey.get(f.a+'|'+f.dt+'|'+f.tm)||[]).filter(m=>m.o===f.o-1||(m.g&&(byKey.get(f.a+'|'+f.dt+'|'+f.tm)||[]).some(z=>z.g===m.g&&z.o===f.o-1)));if(!ms.length)continue;
    const g0=ms.find(m=>m.o===f.o-1);const grp=g0.g?ms.filter(m=>m.g===g0.g):[g0];const g=g0.g||uid();
    grp.forEach(m=>{if(m.g!==g)up.push({...m,g})});up.push({...f,g})}
  /* 另記的單筆「跨國／海外交易手續費」（例如對話記帳）→ 併入同帳戶、同日，金額 1.5% 相符或名稱／商家相符的那筆支出 */
  const FEE=/^(跨國|海外)交易手續費$/,done=new Set(up.map(r=>r.id)),used=new Set();
  for(const f of D.live){if(f.g||done.has(f.id)||!FEE.test(f.n||'')||f.t!=='支出'&&f.t!=='手續費')continue;
    const fv=Math.abs(f.m),hint=[f.sh,f.gn,f.ds,f.p].filter(Boolean).join(' ');const units=new Map();
    /* 以首頁的合併方式分組（同 g，或同時間／帳戶／商家的多筆），用整個大項的合計比對 1.5% */
    for(const r of D.live)if(r.t==='支出'&&!FEE.test(r.n||'')&&r.a===f.a&&r.dt===f.dt&&!done.has(r.id)&&!hiddenInList(r)){const k=gkey(r)||r.id;(units.get(k)||units.set(k,[]).get(k)).push(r)}
    let best=null,bs=0;for(const[k,ch]of units){if(used.has(k))continue;const nm=grpName(ch)||grpTitle(ch)||ch[0].n||'',tot=Math.abs(ch.reduce((t,r)=>t+raw(r),0)),df=Math.abs(osFeeOf(tot)-fv);
      const sc=(df===0?2:df<=1?1:0)+((nm&&hint.includes(nm))||ch.some(r=>(r.sh&&hint.includes(r.sh))||(r.n&&hint.includes(r.n)))?1:0);
      if(sc>bs||(sc===bs&&sc&&Math.abs(ch[0].o-f.o)<Math.abs(best[0].o-f.o))){best=ch;bs=sc}}

function cardCycle(a){
  if(!a.stmt)return null;const td=TODAY();const[y,m,d]=td.split('-').map(Number);
  const stmtOf=(yy,mm)=>yy+'-'+p2(mm)+'-'+p2(Math.min(a.stmt,daysIn(yy,mm)));

  const lp=shiftYM(last.slice(0,7),-1).split('-').map(Number);const prev=stmtOf(lp[0],lp[1]);
  let due='';if(a.due){const nm=a.due>a.stmt?last.slice(0,7):shiftYM(last.slice(0,7),1);const[yy,mm]=nm.split('-').map(Number);due=yy+'-'+p2(mm)+'-'+p2(Math.min(a.due,daysIn(yy,mm)))}

/* ---------- Claude 對話記帳收件匣：users/{uid}/inbox/{id} ----------
   文件欄位：kind('exp'|'inc') amt n c s a(帳戶名稱或id) dt tm p sh cu fee
   修改週期：kind='updrule' n="週期名稱" wk('prev'|'next'|'' 遇假日提前/延後/不調整)，未入帳記錄會依新設定重算；刪除週期：kind='delrule' n="週期名稱1,名稱2"（只刪由 Claude 建立的週期及未到期記錄）；分期（單筆合併，不拆本金／利息）：kind='inst' n=名稱 amt=每期金額 cnt=總期數 sno=本次第一筆的期數 dt=該期日期 tot=分期總額(顯示用) rate=年利率(顯示用) a c s；週期可加 sp(JSON 字串 [{n,s,amt,c?}]) 做成一個大項含多個細項
   分項（同一張收據）：sp=JSON 字串 [{c,s,amt,n}]（2 項以上），n 為整張的名稱可留空，fee 只算在第一項
   修改／刪除單筆：kind='edit'|'del' 用 dt(必填) n(原名稱,必填) tm a(選填) 找記錄，必須剛好 1 筆才動作；edit 可改 nn(新名稱) amt c s sh p fee na(新帳戶) ndt ntm
   週期（選填）：rep('D'|'W'|'M'|'Y') iv(間隔,預設1) md(每月指定日,如 "4,8,12") cnt(總次數,0=無限) sno(起始期數,預設1，例如接續舊週期填 8) wk('prev'|'next'遇假日) ；有 rep 時 dt 為起始日，建立週期規則而非單筆
   調整餘額：kind='bal' a(必填,帳戶名稱或id) amt(必填,目標餘額,帳戶幣別) dt tm(選填,預設現在) n(選填,預設「餘額調整」)；
   App 端用 balAt() 算出該帳戶在 dt/tm 當下的實際餘額，與 amt 的差額記成一筆「餘額調整」（跟帳戶頁「調整餘額」按鈕同樣的記法），差額為 0 就不記；
   機器人帳號讀不到任何餘額，差額必須由 App 端計算，收件匣只能傳「目標餘額」，不能直接傳差額                    */

    const label=[x.dt,x.tm,x.n,Number.isFinite(x.amt)?money(x.amt,x.cu):''].filter(Boolean).join(' ');
    if(state==='invalid')failed.push(label+'：'+(inboxInvalidReason(x)||'先前驗證未通過'));

}

  if(unknown)return {reason:'找不到「'+unknown.n+'」的分類'};

const LEDGER_SEARCH_VERIFY_KEY={"key_ops":["verify"],"ext":true,"kty":"EC","x":"F-wQpjFJgfvVh3n66HKOVzJsQZTjGwAelHHcRnJ5vrk","y":"d0vNknfoGd9g2ALCbnfVYEwXgFIMulCBhbJIscVE1Rk","crv":"P-256"};

function ledgerSearchRows(q,records,accounts){
  const fields={name:r=>[r.n,r.gn].filter(Boolean).join(' '),item:r=>r.n,merchant:r=>r.sh,
    account:r=>accounts.get(r.a)?.name,project:r=>r.p,category:r=>[r.c,r.s].filter(Boolean).join(' '),
    query:r=>[r.n,r.gn,r.sh,r.p,r.c,r.s,accounts.get(r.a)?.name].filter(Boolean).join(' ')};
  const filters=Object.entries(fields).filter(([k])=>q[k]).map(([k,get])=>[fuzzyLedgerText(q[k]),get]);
  const groupKey=r=>JSON.stringify([r.g,r.a,r.dt,r.tm,r.cu||accounts.get(r.a)?.cur,r.t]);
  const groupTotals=new Map();
  if(q.amount!==undefined){
    for(const r of records){
      if(r.rv!==1||!r.g)continue;
      const key=groupKey(r);
      groupTotals.set(key,r2((groupTotals.get(key)||0)+r.m));
    }
  }
  const rows=records.filter(r=>(!q.from||r.dt>=q.from)&&(!q.to||r.dt<=q.to)&&
    (q.end_time?(r.tm||'')>=q.time&&(r.tm||'')<=q.end_time:!q.time||(r.tm||'').startsWith(q.time))&&
    (q.amount===undefined||Math.abs(r.m)===q.amount||(r.rv===1&&r.g&&Math.abs(groupTotals.get(groupKey(r)))===q.amount))&&
    filters.every(([term,get])=>fuzzyLedgerText(get(r)).includes(term)));
  return {total:rows.length,rows:rows.slice(0,5).map(r=>({date:r.dt,time:r.tm||'',name:String(r.n||'').slice(0,100),
    group_name:String(r.gn||'').slice(0,80),merchant:String(r.sh||'').slice(0,80),account:String(accounts.get(r.a)?.name||'').slice(0,80),
    project:String(r.p||'').slice(0,80),category:String(r.c||'').slice(0,80),subcategory:String(r.s||'').slice(0,80),
    amount:Math.abs(r.m),currency:r.cu||accounts.get(r.a)?.cur||'TWD',type:r.t,

function splitInboxLookup(reference,command,records,accounts){

  if(rows.total)return {...rows,inbox_status:'recorded'};

async function signedLedgerSearch(doc,owner){
  const x=doc.data();
  if(!isChatGPTInboxId(doc.id)||typeof x.body!=='string'||x.body.length>3200||typeof x.sig!=='string'||x.sig.length!==88)return null;
  const verifyKey=await crypto.subtle.importKey('jwk',LEDGER_SEARCH_VERIFY_KEY,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  const valid=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},verifyKey,ledgerSearchDecode(x.sig),new TextEncoder().encode(x.body));
  if(!valid)return null;
  const req=JSON.parse(x.body);
  if(req.id!==doc.id||req.owner!==owner||req.expires<=Date.now()||req.expires>Date.now()+1800000||
    typeof req.key!=='string'||req.key.length!==64||!req.query||typeof req.query!=='object')return null;
  return req;
}
async function publishLedgerSearch(db,owner,req,result){
  const keyBytes=Uint8Array.from(req.key.match(/../g),x=>parseInt(x,16));
  const key=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const enc=new TextEncoder();
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(req.id)},key,enc.encode(JSON.stringify(result)));
  const entry={expires:req.expires,iv:ledgerSearchEncode(iv),data:ledgerSearchEncode(encrypted)};
  const ref=db.collection('users').doc(owner).collection('kv').doc('botinfo');
  await inboxDeadline(db.runTransaction(async tx=>{
    const snap=await tx.get(ref);
    const prior=Object.entries(snap.data()?.chatgptSearchReplies||{}).filter(([id,v])=>id!==req.id&&v.expires>Date.now());
    const replies=Object.fromEntries([...prior.slice(-11),[req.id,entry]]);
    if(snap.exists)tx.update(ref,{chatgptSearchReplies:replies});
    else tx.set(ref,{...botInfo(),chatgptSearchReplies:replies});
  }));

      !CURS.includes(x.cu)||typeof x.a!=='string'||typeof x.a2!=='string'||x.a===x.a2)return false;

  return Number.isFinite(+date)&&date.toISOString().slice(0,10)===x.dt&&
    [x.a,x.a2].every(id=>S.accts.some(a=>a.id===id&&!a.arch&&a.cur===x.cu));
}
function inboxInvalidReason(x){
  if(x.kind==='transfer')return inboxTransferValid(x)?'':'轉帳帳戶、幣別、時間或金額無效';
  if(x.spv!=null||x.kind==='split_probe')return receiptInboxDetails(x).reason||'';
  const amt=x.amt!=null&&x.amt!==''&&Number.isFinite(+x.amt);
  const account=()=>S.accts.some(a=>a.id===x.a||a.name===x.a);
  if(x.src==='ap')return '';
  if(x.sp!=null){try{
    const lines=typeof x.sp==='string'?JSON.parse(x.sp):x.sp;
    if(!Array.isArray(lines)||!lines.length||lines.some(q=>!q||!Number.isFinite(+q.amt)||!+q.amt))return '分項欄位錯誤';
  }catch(e){return '分項 JSON 無效'}}
  switch(x.kind){
    case 'px':try{const prices=JSON.parse(x.p);return prices&&typeof prices==='object'&&!Array.isArray(prices)&&x.d?'':'價格欄位錯誤'}catch(e){return '價格 JSON 無效'}
    case 'stock_buy':{
      const code=holdCodeOf({t:'支出',c:x.c,s:x.s,n:x.n});
      const category=S.cats.exp.find(c=>c.n===x.c);
      return amt&&+x.amt>0&&account()&&category?.subs.includes(x.s)&&code&&validTradeShares(x.hsq)&&
        (!/^\d/.test(code)||Number.isInteger(x.hsq))&&!x.rep&&!x.sp?'':'股票買入或成交股數欄位錯誤';
    }
    case 'exp':case 'inc':return amt&&+x.amt&&account()?'':'金額或帳戶欄位錯誤';
    case 'bal':return amt&&account()?'':'餘額或帳戶欄位錯誤';
    case 'inst':return amt&&+x.amt&&Number.isInteger(+x.cnt)&&+x.cnt>1&&+x.cnt<=360&&account()&&/^\d{4}-\d{2}-\d{2}$/.test(x.dt||'')?'':'分期欄位錯誤';
    case 'ledger_search':return '';
    case 'attach_to_split':return isChatGPTInboxId(x.target)&&x.n&&x.a&&x.dt&&x.tm&&x.amt>0?'':'缺少來源交易或目標群組';
    case 'split_recover':return isChatGPTInboxId(x.target)?'':'缺少原多品項指令';
    case 'edit_match':return Object.keys(x).every(k=>['kind','dt','a','c','amt','names','_ledgerInbox'].includes(k))&&
      /^\d{4}-\d{2}-\d{2}$/.test(x.dt||'')&&typeof x.a==='string'&&!!x.a&&typeof x.c==='string'&&!!x.c.trim()&&
      typeof x.amt==='number'&&Number.isFinite(x.amt)&&x.amt>0&&inboxEditNames(x)?'':'候選金額修改欄位錯誤';
    case 'manage_ledger':return '';
    case 'revise_record':
    case 'move_group_account':
    case 'edit':case 'del':return x.n&&x.dt?'':'缺少記錄識別欄位';
    case 'rensub':return x.c&&x.s&&String(x.ns||'').trim()?'':'缺少子類別欄位';
    case 'renproj':case 'mvproj':return String(x.o||'').trim()&&String(x.nv||'').trim()?'':'缺少專案欄位';
    case 'updrule':case 'delrule':case 'clrshop':case 'osshop':return String(x.n||'').trim()?'':'缺少名稱';
    case 'gold':return x.q!=null&&x.q!==''&&Number.isFinite(+x.q)&&+x.q>=0?'':'黃金數量錯誤';
    case 'hold':return x.rm==='1'||(x.n&&x.sh!=null&&x.sh!==''&&Number.isFinite(+x.sh)&&+x.sh>=0)?'':'持股欄位錯誤';
    default:return '未知指令';
  }
}
// ChatGPT attach_to_split：將唯一符合的既有支出加入 target 群組，保留原帳戶與時間。
// ChatGPT split_recover：target 是待核對的原多品項指令，補登沿用原分項 ID。
// ChatGPT transfer：a 為轉出帳戶 ID，a2 為轉入帳戶 ID，amt、cu、dt、tm 必填。
// 兩側必須同幣別，保留完成指令避免重送。
function processInbox(docs){
  const uid=Cloud.user?.uid;
  const db=Cloud.db;
  if(!uid||!db)return;
  const ordered=[...docs].sort((a,b)=>(a.data()?.kind==='mvproj')-(b.data()?.kind==='mvproj'));
  inboxBusy=inboxBusy.then(async()=>{
    for(const doc of ordered){
      if(Cloud.user?.uid!==uid||Cloud.db!==db||!Cloud.decided)return;
      if(doc.ref.path!=='users/'+uid+'/inbox/'+doc.id)continue;
      if(doc.data()?._ledgerInbox?.state==='completed'&&isRetainedInbox(doc))continue;
      if(DB.mem){Cloud.inboxErr='IndexedDB 無法使用，已保留收件匣指令';return}
      const key=doc.ref.path;
      const pending=inboxAwaitingCloud.get(key);
      let token;
      try{
        if(pending?.db===db){
          await finishInbox(db,uid,doc.ref,pending);
          continue;
        }
        token=crypto.randomUUID();
        const claim=await claimInbox(db,doc.ref,token);
        if(claim.state==='missing')continue;
        if(claim.state==='completed'){if(!isRetainedInbox(doc))await deleteInboxDoc(doc.ref);continue}
        if(claim.state!=='claimed'){
          Cloud.inboxErr=claim.state==='invalid'?'收件匣指令資料有誤，已保留供核對':'收件匣指令已被領取或待核對，已保留原指令';
          continue;
        }
        if(Cloud.user?.uid!==uid||Cloud.db!==db)return;
        const session={db,token,queue:Cloud.q,retain:isRetainedInbox(claim.doc)};
        const result=await executeInbox([claim.doc]);
        if(result==='applied'){
          inboxAwaitingCloud.set(key,session);
          await finishInbox(db,uid,doc.ref,session);
        }else{
          await updateInboxClaim(db,doc.ref,token,'invalid');
          Cloud.inboxErr='收件匣指令資料有誤，已保留供核對';
        }
      }catch(error){
        if(token&&!inboxAwaitingCloud.has(key)){
          // 即使無法標記待核對，既有的 processing 狀態也會阻止其他裝置重跑。
          await updateInboxClaim(db,doc.ref,token,'review').catch(()=>{});
        }
        Cloud.inboxErr=error?.code==='permission-denied'?'無法領取或更新收件匣指令，請確認 Firestore 規則':'收件匣處理未完成，已保留指令供核對';
      }
    }
  }).catch(()=>{Cloud.inboxErr='收件匣處理未完成，已保留指令供核對'});
}

async function claimInbox(db,ref,token){
  try{
    return await inboxDeadline(db.runTransaction(async tx=>{
      const doc=await tx.get(ref);
      if(!doc.exists)return {state:'missing'};
      const marker=doc.data()._ledgerInbox;
      if(marker!==undefined)return {state:marker?.state||'review'};
      tx.update(ref,{_ledgerInbox:{token,state:'processing',at:firebase.firestore.FieldValue.serverTimestamp()}});
      return {state:'claimed',doc};
    }));
  }catch(error){
    if(error?.code!=='permission-denied')throw error;
    // 規則可能先拒絕競爭失敗的交易。重新讀伺服器可辨識已被領取的文件。
    let current;
    try{current=await inboxDeadline(ref.get({source:'server'}))}catch(e){throw error}
    if(!current.exists)return {state:'missing'};
    const marker=current.data()._ledgerInbox;
    if(marker!==undefined)return {state:marker?.state||'review'};
    throw error;
  }
}

function updateInboxClaim(db,ref,token,state){
  return inboxDeadline(db.runTransaction(async tx=>{
    const doc=await tx.get(ref);
    if(!doc.exists)return 'missing';
    const marker=doc.data()._ledgerInbox;
    if(marker?.state==='completed')return 'completed';
    if(marker?.token!==token||marker.state!=='processing')return 'other';
    tx.update(ref,{_ledgerInbox:{token,state,at:firebase.firestore.FieldValue.serverTimestamp()}});
    return state;
  }));
}

async function inboxDeadline(promise){
  let timer;
  try{
    return await Promise.race([promise,new Promise((_,reject)=>{
      timer=setTimeout(()=>reject(new Error('收件匣操作逾時')),15000);
    })]);
  }finally{clearTimeout(timer)}
}

function hasSplitRecords(id){
  return S.recs.some(r=>r.id===id||r.g===id+'_split'||r.id.startsWith(id+'_'));
}
function splitRecordRows(x,lines,id){
  const g=id+'_split';
  // 即使原記錄後來被編輯或刪除，補登也不能將它復活。
  if(hasSplitRecords(id))return [];
  const acct=S.accts.find(a=>a.id===x.a),expense=x.kind==='exp';
  const currency=x.cu!==acct.cur?{cu:x.cu,xr:+(fxOn(x.cu,x.dt)/fxOn(acct.cur,x.dt)).toPrecision(6)}:{};
  const stamp=Date.now();
  return lines.map((q,i)=>({id:id+'_'+i,a:acct.id,t:expense?'支出':'收入',c:q.c,s:q.s,m:expense?-q.amt:q.amt,
    f:0,d:0,n:q.n,sh:x.sh||'',dt:x.dt,tm:x.tm,p:q.p??String(x.p||'').slice(0,60),ds:'',tg:'chatgpt',w:'',k:'',g,o:stamp+i,rv:1,inv:x.inv||'',...currency}));
}
function reviewedSplitRows(command,reference){
  if(command?._ledgerInbox?.state!=='review'||!['exp','inc'].includes(command.kind))return {reason:'原指令不在待核對狀態'};
  const details=receiptInboxDetails(command);
  if(details.reason)return details;
  return {rows:splitRecordRows(command,details.lines,'ib_'+reference)};
}

function attachToSplit(x){
  const group='ib_'+x.target+'_split';
  const members=D.live.filter(r=>r.g===group&&r.dt===x.dt);
  const matches=D.live.filter(r=>r.dt===x.dt&&r.tm===x.tm&&r.a===x.a&&r.n===x.n&&r.t==='支出'&&
    !r.k&&r.m===-x.amt);
  if(matches.length!==1)return {reason:'找不到唯一的來源支出'};
  const [source]=matches;
  const currency=r=>r.cu||D.acct.get(r.a)?.cur;
  if(members.length<2||!currency(source)||members.some(r=>r.rv!==1||r.t!=='支出'||currency(r)!==currency(source)))
    return {reason:'目標多品項交易不存在或幣別不同'};
  if(source.g===group)return {};
  if(source.g||source.rv||source.f||source.d||source.inv)return {reason:'來源支出已有群組或包含額外項目'};
  return {row:{...source,g:group,rv:1}};
}

async function executeInbox(docs){
  const add=[],dels=[],newRules=[],delNames=[],upds=[],insts=[],eds=[],rups=[],balMsgs=[];
  let apN=0,apDup=0,apUnk=0,pxN=0;const mvq=[];
  let invalid='';
  const reject=reason=>{invalid=reason};
  for(const d of docs){const x=d.data()||{};const id='ib_'+d.id;
    const reason=inboxInvalidReason(x);
    if(reason){reject(reason);continue}
    if(x.kind==='transfer'){
      if(!isChatGPTInboxId(d.id)){reject('轉帳指令來源不符');continue}
      if(x.ntm!==undefined){
        const atOriginalTime=r=>r.dt===x.dt&&r.tm===x.tm;
        const outgoing=D.live.filter(r=>r.k&&r.t==='轉出'&&r.a===x.a&&r.m===-x.amt&&atOriginalTime(r));
        const pairs=outgoing.map(r=>[r,D.live.filter(p=>p.k===r.k&&p.id!==r.id)]);
        const matches=pairs.filter(([,partners])=>partners.length===1&&partners[0].t==='轉入'&&
          partners[0].a===x.a2&&partners[0].m===x.amt&&atOriginalTime(partners[0]));
        if(matches.length!==1){reject('找不到唯一符合的轉帳');continue}
        const [[out,[incoming]]]=matches;
        if(x.ntm!==x.tm){
          await mutate([out,incoming].map(r=>({...r,tm:x.ntm})));
          scheduleRender();toast('ChatGPT 已修改轉帳時間 '+x.ntm);
        }
        dels.push(d.ref);continue;
      }
      const ids=[id+'_out',id+'_in'];
      const known=ids.map(recordId=>S.byId.has(recordId));
      if(known[0]!==known[1]){reject('轉帳只有一側，請先核對');continue}
      if(!known[0]){
        const rows=buildRecords0({kind:'tr',a:x.a,a2:x.a2,amt:String(x.amt),dt:x.dt,tm:x.tm});
        await mutate(rows.map((row,i)=>({...row,id:ids[i],k:id,tg:'chatgpt'})));
        scheduleRender();toast('ChatGPT 已記錄轉帳 '+fmt(x.amt));
      }
      dels.push(d.ref);continue;
    }
    if(x.kind==='attach_to_split'){
      if(!isRetainedInbox(d)){reject('合併指令來源不符');continue}
      const attached=attachToSplit(x);
      if(attached.reason){reject(attached.reason);continue}
      if(attached.row){await mutate([attached.row]);scheduleRender();toast('已加入多品項交易')}
      dels.push(d.ref);continue;
    }
    if(x.kind==='split_recover'){
      if(!isChatGPTInboxId(d.id)||d.id===x.target){reject('補登指令來源不符');continue}
      const uid=Cloud.user?.uid,db=Cloud.db;
      const original=await inboxDeadline(db.doc('users/'+uid+'/inbox/'+x.target).get({source:'server'}));
      if(Cloud.user?.uid!==uid||Cloud.db!==db)throw new Error('帳本連線已變更');
      const recovery=reviewedSplitRows(original.data(),x.target);
      if(recovery.reason){reject(recovery.reason);continue}
      add.push(...recovery.rows);dels.push(d.ref);continue;
    }
    if(x.spv===1){
      if(!isChatGPTInboxId(d.id)){reject('多類別指令來源不符');continue}
      if(x.kind==='split_probe'){dels.push(d.ref);continue}
      const {lines}=receiptInboxDetails(x);
      if(x.kind==='split_revise'){
        if(!isChatGPTInboxId(x.target)||!x.inv||(x.revision!==undefined&&!isChatGPTInboxId(x.revision))){reject('缺少原發票識別資料');continue}
        const group='ib_'+x.target+'_split';
        const old=D.live.filter(r=>r.g===group).sort((a,b)=>(a.o||0)-(b.o||0));
        const acct=S.accts.find(a=>a.id===x.a);
        const scale=x.cu==='TWD'?1:100;
        if(!old.length||old.length>lines.length||old.some(r=>r.rv!==1||r.inv!==x.inv||r.a!==x.a||
            r.dt!==x.dt||r.tm!==x.tm||r.sh!==x.sh||r.t!=='支出'||(r.cu||acct.cur)!==x.cu||r.f||r.d)||
            old.reduce((sum,r)=>sum+Math.round(Math.abs(r.m)*scale),0)!==Math.round(x.amt*scale)){
          reject('原發票未找到、已變動或合計不同');continue;
        }
        const first=old[0];
        const revised=lines.map((q,i)=>({...first,...old[i],id:old[i]?.id||'ib_'+(x.revision||d.id)+'_line_'+i,
          c:q.c,s:q.s,n:q.n,m:-q.amt,p:q.p??String(x.p||'').slice(0,60),o:(first.o||0)+i}));
        await mutate(revised);scheduleRender();dels.push(d.ref);

    if(x.src==='ap'){if(!S.byId.has(id)){const o=apRecord(x,id);if(o.r){add.push(o.r);apN++;if(!o.sure)apUnk++}else if(o.skip==='dup')apDup++;else{reject('Apple Pay 指令資料不足');continue}}dels.push(d.ref);continue}
    if(x.kind==='px'){try{const q=JSON.parse(x.p||'{}');const cur=S.settings.pxx||{d:'',p:{}};if((x.d||'')>=(cur.d||'')){S.settings.pxx={d:x.d||'',p:{...cur.p,...q}};pxApply(S.settings.pxx.p);pxN++}}catch(e){}dels.push(d.ref);continue}

    }
    if(x.kind==='manage_ledger'){

      if(failure){reject(failure);continue}
      dels.push(d.ref);scheduleRender();continue;
    }
    if(x.kind==='revise_record'){
      const failure=await reviseInboxRecord(x,d);
      if(failure){reject(failure);continue}
      dels.push(d.ref);scheduleRender();continue;
    }
    if(x.kind==='move_group_account'){
      const source=D.acct.get(x.a),target=D.acct.get(x.na);
      if(!isRetainedInbox(d)||!source||!target||target.arch||source.id===target.id||source.cur!==target.cur||
         !/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(x.tm)||!Number.isFinite(x.ga)||x.ga<=0){
        reject('整組換帳戶的資料有誤');continue;
      }
      const matches=D.live.filter(r=>r.g&&!r.k&&r.dt===x.dt&&r.tm===x.tm&&r.a===source.id&&r.n===x.n);
      const groups=new Set(matches.map(r=>r.g));
      const rows=groups.size===1?D.groups.get(matches[0].g)||[]:[];
      if(rows.length<2||rows.some(r=>r.a!==source.id||r.k||r.dt!==x.dt||r.tm!==x.tm||!['支出','收入','手續費'].includes(r.t))||
         Math.abs(r2(rows.reduce((sum,r)=>sum+raw(r),0)))!==x.ga){
        reject('找不到唯一符合的整組交易');continue;

    }

    if(x.kind==='inst'){const amt=Math.abs(+x.amt),k=parseInt(x.cnt)||0,acct=S.accts.find(a=>a.id===x.a||a.name===x.a);
      if(amt>0&&k>1&&acct&&/^\d{4}-\d{2}-\d{2}$/.test(x.dt||'')){const sno=Math.max(1,Math.min(k,parseInt(x.sno)||1));const nm=String(x.n||'分期付款').slice(0,80);const tm=/^\d{2}:\d{2}$/.test(x.tm||'')?x.tm:'00:00';const day=+x.dt.slice(8),o=Date.now();
        const recs=[];for(let i=sno;i<=k;i++){const rid=id+'_i'+i;if(S.byId.has(rid))continue;recs.push({id:rid,a:acct.id,t:'支出',c:x.c||'個人支出',s:x.s||'',m:-amt,f:0,d:0,n:nm,sh:String(x.sh||'').slice(0,60),dt:addMonths(x.dt,i-sno,day),tm,p:String(x.p||'').slice(0,60),ds:nm+'・第 '+i+'/'+k+' 期',tg:'claude',w:'',k:'',g:id,o:o+i})}

        insts.push({rule:S.rules.some(q=>q.id===id)?null:{id,fq:'I',name:nm,total:Math.abs(+x.tot)||amt*k,n:k,rate:parseFloat(x.rate)||0,start:x.dt,a:acct.id,off:sno-1,u:o},recs,nm})}

}

      updated.a=target.id;

      else if(target.cur!==source.cur||x.fx!==undefined){updated.cu=originalCurrency;updated.xr=x.fx}
    }
    return updated;
  });
  await mutate(updates);
  return '';
}

async function manageInboxLedger(x,doc){
  if(!isRetainedInbox(doc)||!validRevisionDay(x.dt)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(x.tm))return '設定欄位有誤';
  let q;try{q=JSON.parse(x.cfg)}catch{return '設定格式有誤'}
  if(!q||typeof q!=='object'||Array.isArray(q))return '設定格式有誤';
  const validNumber=n=>Number.isFinite(n)&&n>=0&&n<=1e12;
  if(x.op==='budget'){
    if(!validNumber(q.amount)||typeof q.category!=='string'||q.category&&!S.cats.exp.some(c=>c.n===q.category))return '預算或分類有誤';
    const next={...S.budgets,cats:{...S.budgets.cats},u:Date.now()};
    if(!q.category)next.total=q.amount;
    else if(q.amount)next.cats[q.category]=q.amount;
    else delete next.cats[q.category];
    await saveKV('budgets',next);return '';
  }
  if(x.op==='holding'||x.op==='remove_holding'){
    if(typeof q.portfolio!=='string'||!q.portfolio.trim()||typeof q.symbol!=='string'||
       !/^(?:\d{4,6}[A-Z]?|[A-Z]{1,5}(?:\.[A-Z])?)$/.test(q.symbol)||
       x.op==='holding'&&(!validNumber(q.shares)||q.currency&&!CURS.includes(q.currency)))return '持股欄位有誤';
    const next={...S.settings,hold:(S.settings.hold||[]).map(h=>({...h}))};
    const i=next.hold.findIndex(h=>(h.pf||'我的')===q.portfolio&&h.code===q.symbol);
    if(x.op==='remove_holding'){if(i>=0)next.hold.splice(i,1)}
    else{
      const h={...(next.hold[i]||{id:uid(),name:''}),pf:q.portfolio,code:q.symbol,sh:q.shares};
      h.cu=q.currency||h.cu||(/^[A-Z]/.test(q.symbol)?'USD':'TWD');
      if(i>=0)next.hold[i]=h;else next.hold.push(h);
    }
    await saveKV('settings',next);return '';
  }
  if(typeof x.n!=='string'||!x.n.trim())return '缺少名稱';
  const installment=x.op.endsWith('installment');
  const id='ib_'+doc.id;
  if(x.op==='create_recurring'||x.op==='create_installment'){
    const account=D.acct.get(q.account),category=S.cats[q.type]?.find(c=>c.n===q.category);
    if(!account||account.arch||!category||!(category.subs.length?category.subs.includes(q.sub):q.sub==='')||
       !validNumber(q.amount)||!q.amount||!Number.isInteger(q.count)||
       (installment?(q.type!=='exp'||q.count<2||q.count>360||!validNumber(q.rate)||q.rate>100):
       (!['D','W','M','Y'].includes(q.frequency)||q.count<0||q.count>800||!Number.isInteger(q.interval)||q.interval<1||q.interval>120)))return '分期或週期設定有誤';
    if(!S.rules.some(r=>r.id===id)){
      const base={id,name:x.n,start:x.dt,u:Date.now()};
      if(installment){
        const rows=amortize(q.amount,q.count,q.rate).flatMap(({pr,int},i)=>{
          const dt=addMonths(x.dt,i,+x.dt.slice(8)),ds=x.n+'・第 '+(i+1)+'/'+q.count+' 期';
          const common={a:q.account,dt,tm:x.tm,f:0,d:0,sh:'',p:'',ds,tg:'chatgpt',w:'',k:'',g:id,o:Date.now()+2*i};
          return [{...common,id:id+'_'+i+'_0',t:'支出',c:q.category,s:q.sub,n:x.n,m:-pr},
            ...(int>0?[{...common,id:id+'_'+i+'_1',t:'利息',c:'利息支出',s:'利息支出',n:'分期利息',m:-int,o:common.o+1}]:[])];
        });
        const missing=rows.filter(r=>!S.byId.has(r.id));
        if(missing.length)await mutate(missing);
        await saveKV('rules',[...S.rules,{...base,fq:'I',total:q.amount,n:q.count,rate:q.rate,a:q.account,off:0}]);
      }else{
        const fs={kind:q.type,a:q.account,c:q.category,s:q.sub,n:x.n,amt:String(q.amount),dt:x.dt,tm:x.tm,ids:[]};
        const rule={...base,fs,fq:q.frequency,iv:q.interval,end:'',cnt:q.count,done:0,next:'',on:1,off:0,wk:''};
        await saveKV('rules',[...S.rules,rule]);
      }
    }
    if(!installment)await runRules();
    return '';
  }
  if(!['pause_recurring','resume_recurring','update_recurring','stop_recurring','stop_installment','update_installment'].includes(x.op))return '未知設定操作';
  if(x.op==='update_recurring'&&(!validNumber(q.amount)||!q.amount))return '週期金額有誤';
  const matches=S.rules.filter(r=>(r.fq==='I')===installment&&(r.name===x.n||r.fs?.n===x.n));
  if(matches.length!==1)return '找不到唯一符合的分期或週期';
  const rule=matches[0],today=TODAY(),stopping=x.op.startsWith('stop_');
  if(x.op==='update_installment')return updateInboxInstallment(rule,q);
  const future=D.live.filter(r=>r.dt>today&&(installment?r.g===rule.id:r.id.startsWith(rule.id+'_')&&/_\d+_\d+$/.test(r.id)));
  if(x.op!=='resume_recurring'&&future.length)await mutate([],future.map(r=>r.id));
  if(stopping){await saveKV('rules',S.rules.filter(r=>r.id!==rule.id));return ''}
  let done=rule.done;
  if(x.op!=='resume_recurring')while(done>0&&ruleOccDate(rule,done-1)>today)done--;
  const next={...rule,done,on:x.op==='pause_recurring'?0:x.op==='resume_recurring'?1:rule.on,
    fs:x.op==='update_recurring'?{...rule.fs,amt:String(q.amount)}:rule.fs,u:Date.now()};
  next.next=ruleNext(next);
  await saveKV('rules',S.rules.map(r=>r.id===rule.id?next:r));
  await runRules();return '';
}

async function updateInboxInstallment(rule,{count=rule.n,rate=rule.rate??0}){
  if(!Number.isInteger(count)||count<2||count>360||!Number.isFinite(rate)||rate<0||rate>100)
    return '分期期數或年利率有誤';
  if(count===rule.n&&rate===(rule.rate??0))return '';
  const today=TODAY(),rows=D.groups.get(rule.id)||[];
  const principal=rows.filter(r=>r.t==='支出');
  const nextCount=rule.n-(rule.off||0);
  const dates=new Map(principal.map(r=>[r.dt,r]));
  const account=D.acct.get(rule.a);
  const interestByDate=new Map(rows.filter(r=>r.t==='利息').map(r=>[r.dt,r]));
  if(interestByDate.size!==rows.length-principal.length||!account||account.arch||!validRevisionDay(rule.start)||principal.length!==nextCount||dates.size!==nextCount||
     rows.some(r=>r.a!==rule.a||r.k||r.cu||r.xr||r.f||r.d||!['支出','利息'].includes(r.t)||
       !Number.isFinite(r.m)||r.m>0||!dates.has(r.dt))||
     principal.some((_,i)=>!dates.has(addMonths(rule.start,i,+rule.start.slice(8))))||
     r2(principal.reduce((sum,r)=>sum-r.m,0))<=0)return '分期紀錄有缺漏或已個別修改，請先核對';
  const future=principal.filter(r=>r.dt>today).sort((a,b)=>a.dt.localeCompare(b.dt));
  const fixedCount=rule.n-future.length;
  const periods=count-fixedCount;
  if(!future.length||periods<1)return '新期數須保留至少一期未到期款項';
  const scale=['TWD','JPY','KRW','VND'].includes(account.cur)&&future.every(r=>Number.isInteger(r.m))?1:100;
  const balance=Math.round(future.reduce((sum,r)=>sum-r.m,0)*scale);
  const plan=amortize(balance,periods,rate);
  if(plan.some(p=>p.pr<=0||!Number.isFinite(p.int)))return '剩餘本金不足以依新期數分攤';
  const retired=rows.filter(r=>r.dt>today);
  const first=future[0],startIndex=fixedCount-(rule.off||0);
  const out=plan.flatMap(({pr,int},i)=>{
    const dt=addMonths(rule.start,startIndex+i,+rule.start.slice(8));
    const source=dates.get(dt)||first;
    const interest=interestByDate.get(dt);
    const ds=rule.name+'・第 '+(fixedCount+i+1)+'/'+count+' 期'+(rate?'・本息均攤：年利率 '+rate+'%':'');
    const expense={...source,id:dates.get(dt)?.id||rule.id+'_rescheduled_'+(startIndex+i)+'_0',dt,ds,m:-pr/scale,o:first.o+i*2};
    return [expense,...(int?[{...expense,id:interest?.id||rule.id+'_rescheduled_'+(startIndex+i)+'_1',t:'利息',
      c:'利息支出',s:'利息支出',n:'分期利息',m:-int/scale,o:expense.o+1}]:[])];
  });
  const kept=new Set(out.map(r=>r.id));
  await mutate(out,retired.filter(r=>!kept.has(r.id)).map(r=>r.id),{...rule,n:count,rate,u:Date.now()});
  return '';
}
