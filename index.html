/* ================= 電子發票 QR（紙本證明聯）＋依歷史自動分類 =================
   規格：財政部「電子發票證明聯一維及二維條碼規格」
   左 QR：發票字軌(10) 開立日期民國yyyMMdd(7) 隨機碼(4) 銷售額hex(8) 總計hex(8) 買方統編(8) 賣方統編(8) 加密驗證(24)
          :營業人自行使用區(10):二維條碼記載品目筆數:交易品目總筆數:中文編碼(0 Big5/1 UTF-8/2 Base64):品名:數量:單價:...
   右 QR：以 ** 開頭，接續 品名:數量:單價:...                                                      */
let _jsqr=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve(window.jsQR);if(_jsqr)return _jsqr;
  _jsqr=loadScripts([window.__ARTIFACT__?'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js':'jsQR.js']).then(()=>window.jsQR);return _jsqr}
const latin1=b=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return s};
function decodeItems(bytes,enc){
  try{if(enc==='0')return new TextDecoder('big5').decode(new Uint8Array(bytes));
    if(enc==='2'){const t=atob(latin1(bytes).replace(/[^A-Za-z0-9+/=]/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(t,c=>c.charCodeAt(0)))}
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes))}catch(e){return latin1(bytes)}
}
const isLeftQR=b=>/^[A-Z]{2}\d{8}\d{7}[0-9A-Za-z]{4}[0-9a-fA-F]{16}\d{16}/.test(latin1(b.slice(0,53)));
const isRightQR=b=>b[0]===42&&b[1]===42;
function parseInvoice(left,right){
  const L=latin1(left);
  const no=L.slice(0,10),ry=+L.slice(10,13),dt=(ry+1911)+'-'+L.slice(13,15)+'-'+L.slice(15,17);
  const total=parseInt(L.slice(29,37),16),pre=parseInt(L.slice(21,29),16),buyer=L.slice(37,45),seller=L.slice(45,53);
  // colon positions in the byte stream (ASCII ':' never appears inside Big5/UTF-8 multibyte sequences)
  const cols=[];for(let i=77;i<left.length&&cols.length<5;i++)if(left[i]===58)cols.push(i);
  let enc='1',inQR=0,cnt=0,items=[];
  if(cols.length>=5){const f=L.slice(cols[0]+1,cols[4]).split(':');inQR=+f[1]||0;cnt=+f[2]||0;enc=f[3]||'1';
    let txt=decodeItems(left.slice(cols[4]+1),enc);
    if(right&&right.length>2)txt+=':'+decodeItems(right.slice(2),enc);
    const tk=txt.split(':').map(x=>x.trim());
    for(let i=0;i+2<tk.length+1;i+=3){const n=tk[i],q=parseFloat(tk[i+1]),pr=parseFloat(tk[i+2]);if(!n)continue;if(!isFinite(q)||!isFinite(pr))continue;items.push({n,q,p:pr,amt:r2(q*pr)})}}
  return{no,dt,total,pre,buyer:buyer==='00000000'?'':buyer,seller,enc,inQR,cnt,items,needRight:cnt>inQR&&!right};
}
function decodeFromCanvas(jsQR,ctx,w,h){
  const found=[];const tryRegion=(x,y,ww,hh)=>{if(ww<40||hh<40)return;const im=ctx.getImageData(x,y,ww,hh);const r=jsQR(im.data,ww,hh,{inversionAttempts:'dontInvert'});if(r&&r.binaryData&&!found.some(f=>latin1(f).slice(0,30)===latin1(r.binaryData).slice(0,30)))found.push(r.binaryData)};
  tryRegion(0,0,w,h);tryRegion(0,0,Math.round(w*0.55),h);tryRegion(Math.round(w*0.45),0,w-Math.round(w*0.45),h);
  if(found.length<2){tryRegion(0,Math.round(h*0.3),Math.round(w*0.55),Math.round(h*0.7));tryRegion(Math.round(w*0.45),Math.round(h*0.3),w-Math.round(w*0.45),Math.round(h*0.7))}
  return found;
}
async function decodeImageFile(file){
  const jsQR=await loadJsQR();const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const out=[];for(const maxW of[1400,2200,900]){const sc=Math.min(1,maxW/img.naturalWidth);const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
      for(const b of decodeFromCanvas(jsQR,ctx,w,h))if(!out.some(x=>latin1(x).slice(0,30)===latin1(b).slice(0,30)))out.push(b);
      if(out.some(isLeftQR)&&out.some(isRightQR))break}
    return out}finally{URL.revokeObjectURL(url)}
}

/* ---------- 依歷史記錄分類 ---------- */
let _clf=null;
const normName=s=>String(s||'').toLowerCase().replace(/[\s\-_*＊xX×]+\d*$/,'').replace(/[\s()（）\[\]【】.,，。'"!！?？#＃:：/／\\|+＋]/g,'').replace(/\d+(ml|g|kg|入|包|瓶|罐|個|片|顆|盒|袋|l|cc)?/gi,'');
function grams(s){const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));if(s.length===1)g.add(s);return g}
const _clfs={};
function classifier(kind='exp'){
  const key=D.live.length+'|'+(S.recs.length);if(_clfs[kind]&&_clfs[kind].key===key)return _clfs[kind];const T=kind==='inc'?'收入':'支出';
  const byName=new Map(),byShop=new Map(),gram=new Map(),total=new Map();let n=0;
  const inc=(m,k,v,w=1)=>{let x=m.get(k);if(!x)m.set(k,x=new Map());x.set(v,(x.get(v)||0)+w)};
  for(const r of D.live){if(r.t!==T||!r.c||(kind==='inc'?r.m<0:r.m>0))continue;const v=r.c+'\u0001'+(r.s||'');total.set(v,(total.get(v)||0)+1);n++;
    const nm=normName(r.n);if(nm){inc(byName,nm,v);for(const g of grams(nm))inc(gram,g,v)}
    if(r.sh)inc(byShop,normName(r.sh),v)}
  return(_clfs[kind]={key,byName,byShop,gram,total,n});
}
function suggestCat(name,shop,kind='exp'){
  const C=classifier(kind);const sc=new Map();const add=(m,w)=>{if(!m)return;let t=0;for(const v of m.values())t+=v;for(const[k,v]of m)sc.set(k,(sc.get(k)||0)+w*v/t)};
  const nm=normName(name);
  if(nm){add(C.byName.get(nm),6);const gs=grams(nm);for(const g of gs){const m=C.gram.get(g);if(!m)continue;let t=0;for(const v of m.values())t+=v;const idf=Math.log(1+C.n/t);add(m,idf/gs.size)}}
  if(shop)add(C.byShop.get(normName(shop)),2.5);
  let best=null,bv=0,sum=0;for(const[k,v]of sc){sum+=v;if(v>bv){bv=v;best=k}}
  if(!best){const t=[...C.total.entries()].sort((a,b)=>b[1]-a[1])[0];if(!t){const c=S.cats[kind][0];return{c:c?.n||'',s:c?.subs[0]||'',conf:0}}best=t[0];bv=0;sum=1}
  const exact=!!(nm&&C.byName.has(nm));
  if(kind==='inc'&&!exact){const rules=[[/加班/,'加班費'],[/年終/,'年終'],[/獎金|分紅/,'獎金'],[/股利/,'股票現金股利'],[/利息/,'利息'],[/薪/,'薪資'],[/津貼|補助|補發|代金/,'津貼']];
    for(const[re,sub]of rules)if(re.test(name)){const m=S.cats.inc.find(q=>q.subs.includes(sub));if(m)return{c:m.n,s:sub,conf:.8,exact:false}}}
  const[c,s]=best.split('\u0001');return{c,s,conf:sum?Math.min(1,bv/sum):0,exact};
}
function acctForIncome(){const cnt=new Map();let k=0;for(const r of D.live){if(r.t!=='收入')continue;cnt.set(r.a,(cnt.get(r.a)||0)+1);if(++k>60)break}let b=null,bv=0;for(const[a,v]of cnt)if(v>bv&&!D.acct.get(a)?.arch){b=a;bv=v}return b}
function acctForShop(shop){if(!shop)return null;const n=normName(shop);const cnt=new Map();let k=0;for(const r of D.live){if(r.t!=='支出'||!r.sh||normName(r.sh)!==n)continue;cnt.set(r.a,(cnt.get(r.a)||0)+1);if(++k>40)break}
  let b=null,bv=0;for(const[a,v]of cnt)if(v>bv&&!D.acct.get(a)?.arch){b=a;bv=v}return b}

/* ---------- 明細表（無 QR）：iPhone「掃描文字」或貼上文字 → 解析品名與金額 ---------- */
const RC_SKIP=/小計|合計|總計|總額|應收|應付|實收|找零|找錢|現金|信用卡|悠遊|一卡通|街口|line ?pay|全支付|載具|統一編號|統編|發票|收據|日期|時間|序號|機號|收銀|店號|電話|地址|營業稅|稅額|稅率|訂單|會員|點數|紅利|餘額|謝謝|歡迎|退換|交易|明細|品名|數量|單價|金額|tel|total|subtotal|change|cash|visa|master/i;
const RC_TOTAL=/總計|合計|應付|應收|實付|total/i;
const numTok=t=>{const c=String(t).replace(/[TXtx*元]+$/,'').replace(/^\$/,'').replace(/−/,'-');return/^-?\d{1,3}(,\d{3})+(\.\d+)?$|^-?\d+(\.\d+)?$/.test(c)?parseFloat(c.replace(/,/g,'')):null};
function parseReceiptText(txt){
  const lines=String(txt||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/[\t　]+/g,' ').replace(/\s+/g,' ').split(' ').filter(t=>!/^-?\d+(\.\d+)?%$/.test(t)).join(' ').trim()).filter(l=>l&&!/^\d{1,2}月$|^\d{4}(年)?$|^\d{4}[\/-]\d{1,2}([\/-]\d{1,2})?$/.test(l));
  let total=null;const items=[];const names=[],nums=[];
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(RC_TOTAL.test(l)){const ns=l.split(' ').map(numTok).filter(x=>x!=null);const nx=i+1<lines.length?numTok(lines[i+1].replace(/\s/g,'')):null;const v=ns.length?ns[ns.length-1]:nx;if(v!=null&&v>0)total=v;if(!ns.length&&nx!=null)i++;continue}
    if(RC_SKIP.test(l))continue;
    const toks=l.split(' ');const tail=[];while(toks.length&&numTok(toks[toks.length-1])!=null)tail.unshift(numTok(toks.pop()));
    let name=toks.join(' ').trim();let q=1;const qm=/^(.*?)\s*[*xX×]\s*(\d+)$/.exec(name);if(qm){name=qm[1].trim();q=+qm[2]}
    if(name&&tail.length){const amt=tail[tail.length-1];let qty=q;if(tail.length>=2&&tail[0]>0&&tail[0]<100&&Number.isInteger(tail[0]))qty=tail[0];
      if(amt!==0&&Math.abs(amt)<1e6)items.push({n:name,q:qty,p:r2(amt/qty),amt})}
    else if(name&&!/\d{4,}/.test(name)&&name.length<=30)names.push(name);
    else if(!name&&tail.length)nums.push(tail[tail.length-1]);
  }
  if(items.length<Math.min(names.length,nums.length)){items.length=0;const k=Math.min(names.length,nums.length);for(let i=0;i<k;i++)if(nums[i])items.push({n:names[i],q:1,p:nums[i],amt:nums[i]})}
  const sum=r2(items.reduce((s,x)=>s+x.amt,0));
  let shopGuess='';const head=lines.slice(0,3).join(' ');let best=0;const seen=new Set();
  for(const r of D.live){if(!r.sh||seen.has(r.sh))continue;seen.add(r.sh);if(r.sh.length>best&&r.sh.length>=2&&head.includes(r.sh)){shopGuess=r.sh;best=r.sh.length}if(seen.size>3000)break}
  const incHits=items.filter(x=>/薪|津貼|獎金|補助|加班|股利|利息|年終|分紅|補發|退款/.test(x.n)).length;
  return{kind:items.length&&incHits>=Math.max(2,items.length/2)?'inc':'exp',shopGuess,no:'',dt:TODAY(),total:total||sum,pre:0,buyer:'',seller:'',enc:'',inQR:items.length,cnt:items.length,items,needRight:false};
}

/* ================= 統計（日／週／月／季／年／自訂）＋搜尋與批次取代 ================= */
const MODES=[['D','日'],['W','週'],['M','月'],['Q','季'],['Y','年'],['C','自訂']];
const dOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function weekStart(dt){return addDays(dt,-((dOf(dt).getDay()+6)%7))}
function periodRange(mode,a){
  a=a||TODAY();const y=+a.slice(0,4),m=+a.slice(5,7);
  switch(mode){
    case'D':return{from:a,to:a,label:a.replace(/-/g,'/')+'（週'+wd(a)+'）'};
    case'W':{const f=weekStart(a),t=addDays(f,6);return{from:f,to:t,label:f.replace(/-/g,'/')+' – '+t.slice(5).replace('-','/')}}
    case'M':return{from:a.slice(0,7)+'-01',to:a.slice(0,7)+'-'+p2(daysIn(y,m)),label:y+' 年 '+m+' 月'};
    case'Q':{const q=Math.floor((m-1)/3),fm=q*3+1;return{from:y+'-'+p2(fm)+'-01',to:y+'-'+p2(fm+2)+'-'+p2(daysIn(y,fm+2)),label:y+' 年 Q'+(q+1)}}
    case'Y':return{from:y+'-01-01',to:y+'-12-31',label:y+' 年'};
    default:{let f=S.stat.from||addDays(TODAY(),-29),t=S.stat.to||TODAY();if(f>t)[f,t]=[t,f];return{from:f,to:t,label:f.replace(/-/g,'/')+' – '+t.replace(/-/g,'/')}}
  }
}
function shiftAnchor(mode,a,n){return mode==='D'?addDays(a,n):mode==='W'?addDays(a,7*n):mode==='M'?addMonths(a.slice(0,7)+'-01',n):mode==='Q'?addMonths(a.slice(0,7)+'-01',3*n):mode==='Y'?addMonths(a.slice(0,4)+'-01-01',12*n):a}
function shortLbl(g,from){switch(g){case'D':return from.slice(5).replace('-','/');case'W':return from.slice(5).replace('-','/');case'M':return+from.slice(5,7)===1?from.slice(2,4)+'/1':+from.slice(5,7)+'月';case'Q':return from.slice(2,4)+'Q'+(Math.floor((+from.slice(5,7)-1)/3)+1);default:return from.slice(0,4)}}
function bucketsIn(r,g){
  const out=[];let cur=g==='D'?r.from:g==='W'?weekStart(r.from):g==='M'?r.from.slice(0,7)+'-01':g==='Q'?periodRange('Q',r.from).from:r.from.slice(0,4)+'-01-01';
  while(cur<=r.to&&out.length<400){const pr=periodRange(g,cur);out.push({from:pr.from<r.from?r.from:pr.from,to:pr.to>r.to?r.to:pr.to,g,anchor:cur,short:shortLbl(g,pr.from)});cur=shiftAnchor(g,cur,1)}
  return out;
}
function autoGran(r){const span=dayDiff(r.from,r.to)+1;return span<=31?'D':span<=26*7?'W':span<=4*366?'M':'Y'}
function trendBuckets(mode,a){
  if(mode==='C'){const r=periodRange('C');return bucketsIn(r,autoGran(r))}
  const N={D:14,W:12,M:12,Q:8,Y:6}[mode];const out=[];
  for(let i=N-1;i>=0;i--){const an=shiftAnchor(mode,a,-i);const pr=periodRange(mode,an);out.push({...pr,g:mode,anchor:an,short:shortLbl(mode,pr.from)})}

function searchRecs(){
  const q=S.search;const terms=q.q.trim().toLowerCase().split(/\s+/).filter(Boolean);const mn=evalAmt(q.min),mx=evalAmt(q.max);
  const any=terms.length||q.type||q.a||q.from||q.to||q.c||q.p||q.sh||isFinite(mn)||isFinite(mx);if(!any)return[];
  return D.live.filter(r=>{if(q.type&&r.t!==q.type)return false;if(q.a&&r.a!==q.a)return false;if(q.from&&r.dt<q.from)return false;if(q.to&&r.dt>q.to)return false;
    if(q.c&&r.c!==q.c)return false;if(q.p&&r.p!==q.p)return false;if(q.sh&&(q.sh==='__none__'?!!r.sh:r.sh!==q.sh))return false;const am=Math.abs(raw(r));if(isFinite(mn)&&am<mn)return false;if(isFinite(mx)&&am>mx)return false;
    if(!terms.length)return true;
    const hay=((r.n||'')+' '+(r.gn||'')+' '+(r.sh||'')+' '+(r.c||'')+' '+(r.s||'')+' '+(r.p||'')+' '+(r.w||'')+' '+(D.acct.get(r.a)?.name||'')+' '+Math.abs(r.m)).toLowerCase();return terms.every(t=>hay.includes(t))});
}

let _nidx=null;
function nameIndex(){
  const key=D.live;if(_nidx&&_nidx.key===key)return _nidx;
  const by={exp:new Map(),inc:new Map()};
  for(const r of D.live){const k=r.t==='支出'?'exp':r.t==='收入'?'inc':null;if(!k||!r.n||r.m>0&&k==='exp')continue;
    const n=r.n.trim();if(!n)continue;let o=by[k].get(n);
    if(!o){o={n,cnt:0,last:r.dt,cats:new Map(),shops:new Map(),amt:Math.abs(raw(r)),cu:r.cu||''};by[k].set(n,o)}
    o.cnt++;const ck=r.c+'\u0001'+(r.s||'');o.cats.set(ck,(o.cats.get(ck)||0)+1);if(r.sh)o.shops.set(r.sh,(o.shops.get(r.sh)||0)+1)}
  _nidx={key,by};return _nidx;
}
const topOf=m=>{let b=null,v=0;for(const[k,c]of m)if(c>v){b=k;v=c}return b};
function rankCats(name,shop,kind,k=3){
  if(kind==='inc'){const out=new Map();for(const o of nameIndex().by.inc.values())if(o.n.includes(name)||name.includes(o.n))for(const[c,v]of o.cats)out.set(c,(out.get(c)||0)+v);
    return[...out.entries()].sort((a,b)=>b[1]-a[1]).slice(0,k).map(([c])=>c.split('\u0001'))}
  const C=classifier();const sc=new Map();const add=(m,w)=>{if(!m)return;let t=0;for(const v of m.values())t+=v;for(const[x,v]of m)sc.set(x,(sc.get(x)||0)+w*v/t)};
  const nm=normName(name);if(nm){add(C.byName.get(nm),6);const gs=grams(nm);for(const g of gs){const m=C.gram.get(g);if(!m)continue;let t=0;for(const v of m.values())t+=v;add(m,Math.log(1+C.n/t)/gs.size)}}
  if(shop)add(C.byShop.get(normName(shop)),2.5);
  return[...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,k).map(([c])=>c.split('\u0001'));
}

function autoCat(){if(!EF||!(EF.kind==='exp'||EF.kind==='inc')||(EF.splits&&EF._si===-1))return;if(EF._catT&&!EF._autoC)return;
  const q=(EF.n||'').trim();if(q.length<1)return;const kind=EF.kind;const r=rankCats(q,EF.sh,kind,1).filter(([c])=>S.cats[kind].some(m=>m.n===c))[0];if(!r)return;
  const[c,z]=r;if(c===EF.c&&(z||'')===(EF.s||''))return;EF.c=c;EF.s=z||'';EF._autoC=1;EF._spCat=0;EF._cs='';efCatRefresh()}
function fitNameSuggestions(){
  const inp=$('#f-n'),box=$('#f-n-sugg'),body=inp?.closest('.sheet.ed .sb');
  const viewport=window.visualViewport;
  if(!body||!box||box.hidden||document.activeElement!==inp)return;
  const keyboard=viewport&&window.innerHeight-viewport.height>100;
  if(!keyboard){body.style.maxHeight='';return}
  const top=body.getBoundingClientRect().top;
  const bottom=viewport.offsetTop+viewport.height;
  body.style.maxHeight=Math.max(0,bottom-top)+'px';
  const first=box.firstElementChild;
  const limit=first?.nextElementSibling||first;
  if(limit){
    const available=body.getBoundingClientRect().bottom-8;
    const overflow=limit.getBoundingClientRect().bottom-available;
    if(overflow>0)body.scrollTop+=overflow;
  }
}

  const exact=idx.has(q);const cats=exact?[]:rankCats(q,EF.sh,kind,3).filter(([c])=>S.cats[kind].some(m=>m.n===c));

function shopIndex(){

  const m=new Map();
  for(const r of D.live){if(!r.sh||(r.t!=='支出'&&r.t!=='收入'))continue;const n=r.sh.trim();let o=m.get(n);
    if(!o){o={n,cnt:0,last:r.dt,cats:new Map(),accts:new Map(),names:new Map()};m.set(n,o)}
    o.cnt++;const ck=r.c+'\u0001'+(r.s||'');o.cats.set(ck,(o.cats.get(ck)||0)+1);o.accts.set(r.a,(o.accts.get(r.a)||0)+1);if(r.n)o.names.set(r.n,(o.names.get(r.n)||0)+1)}
  _sidx={key,m};return m;
}

let PS=[];
function projSuggest(){
  const box=$('#f-p-sugg'),inp=$('#f-p');if(!box||!inp||!EF)return;if(document.activeElement!==inp){box.hidden=true;return}
  const q=inp.value.trim().toLowerCase();const last=projLast();const cnt=new Map();for(const r of D.live)if(r.p)cnt.set(r.p,(cnt.get(r.p)||0)+1);
  const cand=[];for(const[p,l]of last){const pl=p.toLowerCase();const i=pl.indexOf(q);if(q&&i<0)continue;const done=!!projDoneAt(p);if(!q&&done)continue;if(q&&pl===q&&cand.length===0&&last.size===1)continue;
    cand.push({p,l,done,c:cnt.get(p)||0,sc:(q&&i===0?1e6:0)+(done?0:5e5)+(+l.replace(/-/g,''))/100})}
  cand.sort((a,b)=>b.sc-a.sc);PS=cand.slice(0,7).filter(o=>o.p.toLowerCase()!==q||cand.length>1);
  if(!PS.length){box.hidden=true;return}
  box.innerHTML=PS.map((o,i)=>{const hl=q?esc(o.p).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),m=>`<b>${m}</b>`):esc(o.p);

}

function projOptions(cur){const last=projLast();const cnt=new Map();for(const r of D.live)if(r.p)cnt.set(r.p,(cnt.get(r.p)||0)+1);
  const all=[...last.entries()].sort((a,b)=>a[1]<b[1]?1:-1);const act=all.filter(([p])=>!projDoneAt(p)),done=all.filter(([p])=>projDoneAt(p)).slice(0,30);
  const o=([p,l])=>`<option value="${esc(p)}" ${p===cur?'selected':''}>${esc(p)}</option>`;

function shopOptions(cur,kind,cat){const td=TODAY();const all=[...shopIndex().values()];
  const sc=o=>o.cnt+(dayDiff(o.last,td)<=90?25:0);const used=new Set();const pick=(arr,n)=>{const out=[];for(const o of arr){if(out.length>=n)break;if(used.has(o.n))continue;used.add(o.n);out.push(o)}return out};
  const recent=pick([...all].sort((a,b)=>a.last<b.last?1:a.last>b.last?-1:0),8);
  const inCat=cat?pick(all.filter(o=>(topOf(o.cats)||'').split('\u0001')[0]===cat).sort((a,b)=>sc(b)-sc(a)),12):[];
  const top=pick([...all].sort((a,b)=>sc(b)-sc(a)),30);
  const o=x=>`<option value="${esc(x.n)}" ${x.n===cur?'selected':''}>${esc(x.n)}</option>`;const has=used.has(cur);
  const g=(l,a)=>a.length?`<optgroup label="${l}">${a.map(o).join('')}</optgroup>`:'';
  return`<option value="" ${!cur?'selected':''}>不指定</option>${cur&&!has?`<option selected value="${esc(cur)}">${esc(cur)}</option>`:''}${g('最近',recent)}${g(esc(cat||'')+' 常用',inCat)}${g('常用',top)}<option value="${PICK_NEW}">＋ 新商家／搜尋…</option>`}

/* ================= 自動加值（悠遊卡、一卡通等） =================
   帳戶設定 a.al = {on, thr, amt, from, since}
   從 since 起依時間順序計算餘額；某筆扣款後餘額低於 thr，就在同一時間補一筆「from → 卡片」的轉帳 amt 元。
   ID 固定為 al_<帳戶>_<觸發記錄>_<n>，多台裝置同時執行也不會重複；使用者刪掉的加值不會再補回。 */
let alBusy=false,alTimer=null;
function alSort(a,b){return a.dt<b.dt?-1:a.dt>b.dt?1:(a.tm||'')<(b.tm||'')?-1:(a.tm||'')>(b.tm||'')?1:(a.o||0)-(b.o||0)}
async function mergeAutoload(){
  const grp=new Map();
  for(const r of S.recs){if(r.x||r.tg!=='autoload'||r.t!=='轉入')continue;const m=/^(al_.+)_(\d+)$/.exec(r.id);if(!m)continue;(grp.get(m[1])||grp.set(m[1],[]).get(m[1])).push({r,n:+m[2]})}
  const up=[],rm=[];
  for(const [,l] of grp){if(l.length<2)continue;l.sort((x,y)=>x.n-y.n);const keep=l[0].r;const kout=S.byId.get(keep.id+'_o');if(!kout||kout.x)continue;
    let tot=0;for(const {r} of l)tot+=r.m;
    up.push({...keep,m:tot,u:Date.now()},{...kout,m:-tot,u:Date.now()});
    for(const {r} of l.slice(1)){rm.push(r.id);const o=S.byId.get(r.id+'_o');if(o)rm.push(o.id)}}
  if(up.length){await mutate(up,rm);toast('已把重複的自動加值合併為單筆轉帳')}
}
async function runAutoload(){
  if(alBusy)return 0;await mergeAutoload();const td=TODAY();const add=[];
  for(const a of S.accts){const al=a.al;if(!al||!al.on||a.arch||!(al.amt>0)||!al.from||!D.acct.has(al.from)||al.from===a.id)continue;
    const since=al.since||td;let bal=a.init||0;const mine=[];const exist=new Map();
    for(const r of S.recs){if(r.a!==a.id||r.dt>td)continue;
      if(r.tg==='autoload'&&r.id.startsWith('al_'+a.id+'_')){const trg=r.id.slice(('al_'+a.id+'_').length).replace(/_\d+$/,'');(exist.get(trg)||exist.set(trg,[]).get(trg)).push(r);if(!r.x&&r.dt<since)bal+=val(r);continue}
      if(r.x)continue;if(r.dt<since)bal+=val(r);else mine.push(r)}
    mine.sort(alSort);
    for(const r of mine){bal+=val(r);
      const ex=exist.get(r.id)||[];let n=0;for(const e of ex){if(!e.x)bal+=val(e);n=Math.max(n,+e.id.split('_').pop()+1)}
      const pre='al_'+a.id+'_'+r.id+'_';if(S.byId.get(pre+n)?.x||n===0&&S.byId.get(pre+'0_o')?.x)continue;   // 使用者刪過這次加值 → 尊重
      if(val(r)>=0||bal>=al.thr)continue;
      const times=Math.min(20,Math.ceil((al.thr-bal)/al.amt));   // 一次扣款需要加值幾次，合併成一筆轉帳（例：不足 1,000 ＝ 一筆 1,000，而非兩筆 500）
      if(times>0){const tot=al.amt*times;const id='al_'+a.id+'_'+r.id+'_'+n;const k='alk_'+a.id+'_'+r.id+'_'+n;
        const from=D.acct.get(al.from);const sub=a.grp==='信用卡'?'信用卡繳款':'轉帳';
        const base={dt:r.dt,tm:r.tm||'00:00',o:(r.o||0)+0.5,n:'自動加值',sh:'',p:'',ds:'',tg:'autoload',w:'',f:0,d:0,g:''};
        add.push({...base,id:id+'_o',a:from.id,t:'轉出',c:'轉帳',s:sub,m:-tot,k},{...base,id,a:a.id,t:'轉入',c:'轉帳',s:sub,m:tot,k,o:base.o+0.1});
        bal+=tot}}
  }
  if(!add.length)return 0;
  alBusy=true;try{await mutate(add)}finally{alBusy=false}
  toast('已自動加值 '+add.length/2+' 次');return add.length/2;
}

/* ================= 週期與分期總覽：剩餘期數、未來預計支出／收入／轉帳 ================= */
function rulePerMonth(r){const iv=r.iv||1;return r.fq==='D'?30/iv:r.fq==='W'?30/7/iv:r.fq==='Y'?1/12/iv:1/iv}
function ruleKind(fs){return fs.kind==='inc'?'收入':fs.kind==='tr'?'轉帳':'支出'}
function ruleAmtTWD(fs){const a=D.acct.get(fs.a);const cur=fs.cu||a?.cur||'TWD';const v=fs.kind==='exp'&&fs.splits?fs.splits.reduce((s,x)=>s+(evalAmt(x.amt)||0),0):(evalAmt(fs.amt)||0);return{v,cur,twd:v*rateOf(cur)}}
function upcoming(days){const td=TODAY(),to=addDays(td,days);const out=[];
  for(const r of S.rules){if(r.fq==='I'){for(const x of(D.groups.get(r.id)||[])){if(x.x||x.dt<=td||x.dt>to)continue;out.push({dt:x.dt,n:r.name+(x.t==='利息'?'（利息）':''),k:'支出',twd:Math.abs(x.m)*rateOf(curOf(x)),tag:'分期',a:D.acct.get(x.a)?.name||''})}continue}
    if(!r.on)continue;
    for(let k=0;k<2000;k++){if(r.cnt&&k+(r.off||0)>=r.cnt)break;const d=ruleOccDate(r,k);if(d>to||(r.end&&d>r.end))break;if(d<=td)continue;
      let twd,n=rLabel(r)||ruleKind(r.fs),an=D.acct.get(r.fs.a)?.name||'';
      if(k<r.done){const xs=S.recs.filter(x=>!x.x&&x.id.startsWith(r.id+'_'+k+'_')&&x.t!=='轉入');if(!xs.length)continue;twd=xs.reduce((s,x)=>s+Math.abs(val(x))*rateOf(curOf(x)),0);n=xs[0].n||n;an=D.acct.get(xs[0].a)?.name||an}
      else twd=ruleAmtTWD(r.fs).twd;
      out.push({dt:d,n,k:ruleKind(r.fs),twd,tag:'週期',a:an})}}
  return out.sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0)}
function pageRules(){
  const td=TODAY();const rs=S.rules.filter(r=>r.fq!=='I');const ins=S.rules.filter(r=>r.fq==='I');
  const H=S.schedDays||30;const up=upcoming(H);const sum=k=>Math.round(up.filter(x=>x.k===k).reduce((s,x)=>s+x.twd,0));

  const act=inst.filter(x=>x.left>0).sort((a,b)=>(a.next<b.next?-1:1)),fin=inst.filter(x=>x.left<=0);
  const totRemain=Math.round(act.reduce((s,x)=>s+x.remain,0));const totPer=Math.round(act.reduce((s,x)=>s+x.per,0));
  const instLi=o=>`<div class="li sch"><div class="grow" data-act="push" data-p="inst" data-id="${o.r.id}" role="button" tabindex="0" style="cursor:pointer"><div>${esc(o.r.name)}${o.left>0?'':'<span class="pill">已繳清</span>'}</div>

    <small class="num">${o.left>0?`每期約 ${money(Math.round(o.per))} · 下一期 ${o.next.replace(/-/g,'/')} · 到 ${o.end.replace(/-/g,'/')}`:`總額 ${money(o.r.total)} · ${o.end.replace(/-/g,'/')} 結束`}${o.a?' · '+esc(o.a):''}</small></div>
    <button class="btn sm danger" data-act="inst-del" data-id="${o.r.id}">刪除</button></div>`;
  // 週期
  const kinds=['支出','收入','轉帳'];const mEq=k=>Math.round(rs.filter(r=>r.on&&ruleNext(r)&&ruleKind(r.fs)===k).reduce((s,r)=>s+ruleAmtTWD(r.fs).twd*rulePerMonth(r),0));

    <small class="num">${ruleDesc(r)} · ${money(am.v,am.cur)} · ${esc(a?.name||'')}${k==='轉帳'&&a2?' → '+esc(a2.name):''}</small>

/* ---------- 重複偵測：同帳戶、同類型、同金額，時間相近 ---------- */
function _minOf(r){return r.tm&&r.tm!=='00:00'?+r.tm.slice(0,2)*60+ +r.tm.slice(3,5):null}
function dupOf(r,skip){if(!r||!['支出','收入'].includes(r.t))return null;const v=Math.abs(r.m);const mr=_minOf(r);
  for(const x of D.live){if(x.id===r.id||(skip&&skip.has(x.id))||x.a!==r.a||x.t!==r.t||Math.abs(Math.abs(x.m)-v)>0.005)continue;
    const dd=dayDiff(r.dt,x.dt);if(Math.abs(dd)>1)continue;const mx=_minOf(x);
    if(mr!=null&&mx!=null){if(Math.abs(dd*1440+mx-mr)<=120)return x}else if(dd===0)return x}
  return null}
function dupText(x){return`${x.dt.slice(5).replace('-','/')} ${x.tm&&x.tm!=='00:00'?x.tm+' ':''}${esc(titleOf(x))} ${money(Math.abs(x.m),curOf(x))}`}

  const recent=D.live.filter(r=>r.tg==='ap').slice(0,5);const cards=Object.entries(S.settings.apCards||{}).sort((a,b)=>(b[1].last||'')<(a[1].last||'')?-1:1);

let RC=null;
function stmtParse(txt){const out=[];const td=TODAY();const ty=+td.slice(0,4);
  const skipRe=/合計|總計|小計|本期應繳|最低應繳|前期|上期|應繳總額|繳款截止|信用額度|循環利息|帳單結帳/;
  for(let raw of String(txt||'').split(/\r?\n/)){let line=raw.replace(/"([^"]*)"/g,(_,a)=>a).replace(/\t/g,' ').replace(/,(?!\d{3}(?!\d))/g,' ').trim();if(!line||skipRe.test(line))continue;
    const dre=/(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?|(?<![\d\/])(\d{1,2})\/(\d{1,2})(?![\d\/])/g;let m,dates=[];while((m=dre.exec(line)))dates.push(m);if(!dates.length)continue;
    const d0=dates[0];let y,mo,da;if(d0[1]){y=+d0[1];if(y<1000)y+=y<200?1911:2000;mo=+d0[2];da=+d0[3]}else{mo=+d0[4];da=+d0[5];y=ty;if(`${y}-${p2(mo)}-${p2(da)}`>addDays(td,31))y--}

    let rest=line;for(const d of dates)rest=rest.replace(d[0],' ');
    const nre=/(?<![\w.])\(?-?\$?\d{1,3}(?:,\d{3})+(?:\.\d+)?\)?(?![\w])|(?<![\w.,])\(?-?\$?\d+(?:\.\d{1,2})?\)?(?![\w,])/g;const nums=[...rest.matchAll(nre)];if(!nums.length)continue;
    const last=nums[nums.length-1];let s=last[0];const neg=/^\(|-/.test(s);const v=+s.replace(/[()$,\-]/g,'');if(!(v>0))continue;
    const desc=rest.slice(0,last.index).replace(/\s+/g,' ').replace(/(?:^|\s)(?:TWD|NTD|NT\$?)(?=\s|$)/gi,' ').trim().slice(0,60);
    out.push({dt,v:neg?-v:v,desc,raw:raw.trim().slice(0,120)})}
  return out}
function reconcile(acctId,items){const a=D.acct.get(acctId);if(!a||!items.length)return null;const lo=items.reduce((m,x)=>x.dt<m?x.dt:m,'9999'),hi=items.reduce((m,x)=>x.dt>m?x.dt:m,'0000');
  // 同一張收據拆成多個分項（g 相同）合併成一筆再比對
  const cm=new Map();for(const r of D.live){if(r.a!==acctId||r.dt<addDays(lo,-4)||r.dt>addDays(hi,6))continue;const key=r.g?'g:'+r.g:r.id;let c=cm.get(key);
    if(!c)cm.set(key,c={id:r.id,ids:[],dt:r.dt,tm:r.tm,v:0,fx:false,t:r.t,tg:r.tg,rs:[]});c.ids.push(r.id);c.rs.push(r);c.v+=-val(r);if(r.cu&&r.cu!==a.cur)c.fx=true;if(r.dt<c.dt)c.dt=r.dt}
  const pool=[...cm.values()];for(const c of pool)c.title=c.rs.length>1?(grpName(c.rs)||titleOf(c.rs[0]))+'（'+c.rs.length+' 項）':titleOf(c.rs[0]);

  return{acctId,lo,hi,items,matched,missing,extra,tot:items.reduce((s,x)=>s+x.v,0)}}

function subCands(){const td=TODAY(),from=addMonths(td,-7,1);const grp=new Map();const ign=new Set(S.settings.subIgn||[]);
  for(const r of D.live){if(r.t!=='支出'||r.dt<from||r.dt>td||ruleOf(r)||/^(al_|ib_)/.test(r.id)&&r.tg==='autoload')continue;const nm=(r.sh||r.n||'').trim();if(!nm)continue;
    const key=nm+'|'+r.a+'|'+Math.round(Math.abs(r.m));let g=grp.get(key);if(!g)grp.set(key,g={key,nm,a:r.a,v:Math.round(Math.abs(r.m)),rs:[]});g.rs.push(r)}
  const shopN=new Map();for(const r of D.live){if(r.t!=='支出'||r.dt<from||r.dt>td)continue;const nm=(r.sh||r.n||'').trim();if(nm)shopN.set(nm,(shopN.get(nm)||0)+1)}
  const out=[];
  for(const g of grp.values()){if(ign.has(g.key)||g.rs.length<3||(shopN.get(g.nm)||0)>new Set(g.rs.map(r=>r.dt.slice(0,7))).size*3)continue;const ds=g.rs.map(r=>r.dt).sort();const months=new Set(ds.map(d=>d.slice(0,7)));
    if(months.size<3||g.rs.length>months.size*1.5)continue;let ok=0;for(let i=1;i<ds.length;i++){const d=dayDiff(ds[i-1],ds[i]);if(d>=25&&d<=35)ok++}
    if(ok<2||ds[ds.length-1]<addDays(td,-40))continue;
    if(S.rules.some(ru=>ru.fq!=='I'&&ru.on&&ru.fs&&ru.fs.a===g.a&&Math.abs(Math.abs(evalAmt(ru.fs.amt))-g.v)<1))continue;

/* ---------- 股票市值（價格來自 GitHub Action 每天抓的 prices.json） ----------
   持股 S.settings.hold=[{id,pf(組合),code,name,sh,cu,cost(選填，原幣),px,pxd,pxManual}] */
const PRICE_URL='https://raw.githubusercontent.com/taya20081-stack/ledger/main/prices.json';
let PX=null;   // {d, p:{code:[name,close,cur?]}}，只在本機快取
function pxApply(prices,fallbackDate=''){
  let changed=0;
  for(const h of S.settings.hold||[]){
    const quote=prices?.[h.code];
    if(h.pxManual||!quote)continue;
    const [label,price,currency,date=fallbackDate]=quote;
    if(date&&h.pxd&&date<h.pxd)continue;
    const name=!h.name||h.name===h.code?US_NAMES[String(h.code).toUpperCase()]||label||h.code:h.name;
    const next={px:+price,pxd:date||h.pxd,name,cu:currency||h.cu};
    if(Object.keys(next).some(key=>h[key]!==next[key])){Object.assign(h,next);changed++}
  }
  return changed;
}
let priceRequest=null;

function fetchPriceTable(){
  if(priceRequest)return priceRequest;

  priceRequest=fetch(PRICE_URL,{cache:'no-cache',signal:controller.signal})
    .then(res=>res.ok?res.json():null)
    .finally(()=>{clearTimeout(timer);priceRequest=null});
  return priceRequest;
}

  let months=0;if(g.due){const td=TODAY();months=Math.max(1,(+g.due.slice(0,4)-+td.slice(0,4))*12+(+g.due.slice(5,7)-+td.slice(5,7))+(+g.due.slice(8)>=+td.slice(8)?1:0))}
  return{saved,left,pct:g.target>0?Math.min(1,saved/g.target):0,months,per:months?left/months:0}}

const _monUse=new Map();
function monUse(ym){const key=ym+'|'+D.live.length+'|'+S.recs.length;const c=_monUse.get(ym);if(c&&c.key===key)return c;const by=new Map();let tot=0;
  for(const r of D.live){if(r.dt.slice(0,7)!==ym||excluded(r))continue;const v=spendOf(r)*rateOf(curOf(r));if(!v)continue;tot+=v;by.set(r.c,(by.get(r.c)||0)+v)}
  const o={key,tot,by};_monUse.set(ym,o);return o}
function budCarry(ym,cat){const B=S.budgets;if(!B.roll||!B.since||ym<=B.since)return 0;const base=cat?(B.cats||{})[cat]||0:B.total||0;if(!base)return 0;let carry=0;
  for(let k=B.since;k<ym;k=shiftYM(k,1)){const u=monUse(k);carry+=base-(cat?(u.by.get(cat)||0):u.tot)}return Math.round(carry)}
