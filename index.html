<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>存摺記帳</title>
<meta name="description" content="個人記帳 PWA，支援 MOZE CSV 匯入、多帳戶、多幣別、預算、分期與統計。">
<meta name="theme-color" content="#F8F8F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="存摺記帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: passbook — single paper column (rail nav on desktop), ruled rows, mono figures, seal-red wordmark */
:root{
  --bg:#E9EEEB; --paper:#FBFCFA; --paper2:#F3F6F4; --ink:#1E2940; --muted:#677284; --rule:#D3DBD6;
  --accent:#2A4B7C; --accent-ink:#FFFFFF; --seal:#B5322A; --gain:#1C7656; --warn:#B7791F;
  --shadow:0 10px 30px rgba(30,41,64,.14);
  --c0:#D9653B; --c1:#2F7FBF; --c2:#3E9B6E; --c3:#8C5BB8; --c4:#C9A227; --c5:#C24D7A;
  --c6:#3B9AA6; --c7:#7A8B3A; --c8:#9C6B4A; --c9:#5865C9; --c10:#D0703A; --c11:#6E7F8F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-app="dark"]{
  --bg:#0F141B; --paper:#171E28; --paper2:#1D2532; --ink:#E5E9EF; --muted:#8E98A8; --rule:#2A3442;
  --accent:#8EAEE3; --accent-ink:#0F141B; --seal:#EE7B6E; --gain:#5EC79C; --warn:#E3B04B;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --c0:#EE8A62; --c1:#6AAEE6; --c2:#6CC79A; --c3:#B48BE0; --c4:#E2C25A; --c5:#E57BA5;
  --c6:#67C3CE; --c7:#A9BA63; --c8:#C99A78; --c9:#8D97EC; --c10:#EE9B61; --c11:#9AAABA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.neg{color:var(--seal)} .pos{color:var(--gain)} .mut{color:var(--muted)}
.shell{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;min-height:56px}
.top h1{margin:0;font:600 20px/1.2 var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.ibtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn:hover{background:var(--paper2)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.monthnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.monthnav h1{flex:none}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;font:700 15px/1 var(--serif);transform:rotate(-4deg);flex:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.add{color:var(--accent-ink)}
.tab.add span.plus{width:48px;height:48px;margin-top:-18px;border-radius:16px;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.tab.add svg{stroke:var(--accent-ink);stroke-width:2.4}
@media (min-width:960px){
  .tabbar{top:0;right:auto;width:92px;border-top:0;border-right:1px solid var(--rule);grid-template-columns:1fr;grid-auto-rows:min-content;gap:10px;padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px max(0px,env(safe-area-inset-left,0px));align-content:start}
  .tab{font-size:12px}
  .tab.add{order:-1;margin-bottom:12px}
  .tab.add span.plus{margin-top:0}
  .shell{padding-left:calc(92px + 32px);max-width:calc(780px + 124px);padding-bottom:48px}
}

/* summary */
.sum{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;display:grid;gap:12px}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumrow div{min-width:0}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.big{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.huge{font-size:32px;font-weight:600;line-height:1.15;word-break:break-all}
.bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--gain);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--seal)}
.note{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--rule);font-size:13.5px}
.note b{font-weight:600}
.note .grow{flex:1;min-width:0}
.note.alert{border-color:var(--seal)}
.stack{display:grid;gap:12px}
.mt{margin-top:16px}

/* ledger list */
.day{margin-top:14px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;background:var(--paper2);border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--muted)}
.dayh .num{font-size:12.5px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--paper2)}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-size:15px;white-space:nowrap}
.row .amt small{display:block;font-size:11px;color:var(--muted)}
.row.future{opacity:.62}
.row.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font:600 15px/1 var(--sans);background:var(--c11);flex:none}
.badge.tr{background:var(--accent);color:var(--accent-ink)}
.badge.debt{background:var(--warn)}
.badge.sys{background:var(--c11)}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:99px;border:1px solid var(--rule);color:var(--muted);margin-left:6px;vertical-align:1px;letter-spacing:.04em}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.more-btn{display:block;margin:14px auto 0;border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:8px 18px;color:var(--accent)}

/* passbook (account detail) */
.pb{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-top:14px}
.pbh,.pbr{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(76px,auto) minmax(84px,auto);gap:8px;padding:8px 14px;align-items:center}
.pbh{background:var(--paper2);font-size:11.5px;color:var(--muted);letter-spacing:.08em;border-bottom:1px solid var(--rule)}
.pbr{border-bottom:1px solid var(--rule);cursor:pointer}
.pbr:hover{background:var(--paper2)}
.pbr:last-child{border-bottom:0}
.pbr .d{font-size:12px;color:var(--muted)}
.pbr .m{min-width:0}
.pbr .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbr .m small{font-size:11.5px;color:var(--muted)}
.pbh span:nth-child(n+3),.pbr .a,.pbr .b{text-align:right;white-space:nowrap}
.pbr .b{color:var(--muted)}
@media (max-width:420px){.pbh,.pbr{grid-template-columns:52px minmax(0,1fr) auto}.pbh span:nth-child(4),.pbr .b{display:none}.pbr .a small{display:block;font-size:11px;color:var(--muted)}}
@media (min-width:421px){.pbr .a small{display:none}}

/* accounts */
.grp{margin-top:18px}
.grph{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);letter-spacing:.08em;padding:0 4px 6px}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li:hover{background:var(--paper2)}
.li .grow{flex:1;min-width:0}
.li .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;font-size:12px;color:var(--muted)}
.li .r{text-align:right;white-space:nowrap}
.chev{color:var(--muted);flex:none}

/* segmented, chips */
.seg{display:inline-flex;background:var(--paper2);border:1px solid var(--rule);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* buttons, forms */
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:11px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.fill>*{flex:1}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.in{width:100%;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:16px}
.in:focus{border-color:var(--accent);outline:none}
select.in{appearance:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
details.adv summary{cursor:pointer;color:var(--accent);font-size:13.5px;padding:4px 0}
details.adv[open] summary{margin-bottom:8px}
.amtbox{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding:6px 2px}
.amtbox .cur{font:600 14px var(--mono);color:var(--muted)}
.amtbox input{flex:1;min-width:0;border:0;background:none;font:600 34px/1.1 var(--mono);text-align:right;outline:none;padding:0}
.amtbox .ev{font:13px var(--mono);color:var(--muted)}
.catrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.catbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);border-radius:10px}
.catbtn .badge{width:40px;height:40px;opacity:.55}
.catbtn.on{color:var(--ink);font-weight:600}
.catbtn.on .badge{opacity:1;outline:2px solid var(--ink);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.sheet .sh h2{margin:0;flex:1;font:600 17px var(--serif)}
.sheet .sb{grid-template-columns:minmax(0,1fr);overflow-x:hidden;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);border-radius:18px;max-height:88vh;animation:fade .15s}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
.toast{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
@media (min-width:960px){.toast{bottom:28px}}

/* charts */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin-top:14px;min-width:0}
.card h3{margin:0 0 10px;font:600 15px var(--serif);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font:12px var(--sans);color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .axc{fill:var(--muted);font:11px var(--sans)}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .gl0{stroke:var(--muted);stroke-width:1}
.chart .be{fill:var(--seal)} .chart .bi{fill:var(--gain)} .chart .bh{opacity:1} .chart .bd{opacity:.72}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.chart .ct{fill:var(--ink);font:600 17px var(--mono)}
.chart .cs{fill:var(--muted);font:11px var(--sans)}
.donutwrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:440px){.donutwrap{grid-template-columns:1fr}.donutwrap svg{max-width:200px;margin:0 auto}}
.legend{display:grid;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 4px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.lg:hover{background:var(--paper2)}
.lg i{width:10px;height:10px;border-radius:3px}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .p{color:var(--muted);font-size:12px}
.legend-mini{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend-mini i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* welcome */
.hero{padding-block:28px 8px;display:grid;gap:14px}
.hero h2{font:700 30px/1.25 var(--serif);margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.feat div{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:13.5px}
.feat b{display:block;font-family:var(--serif);font-size:14.5px;margin-bottom:2px}
.prog{font:13px var(--mono);color:var(--muted)}
.hide{display:none!important}
.sel-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:15}
.sel-bar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (min-width:960px){.sel-bar{bottom:16px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.kv>div{min-width:0}
.kv .v{font-size:16px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:6px;align-items:center}
textarea.in{min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.hint code{font-family:var(--mono);font-size:12px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}

.sheet .sb>*{min-width:0}
.cdot{width:11px;height:11px;border-radius:50%;background:var(--muted);display:block;box-shadow:0 0 0 3px var(--paper2)}
.cdot[data-st=ok]{background:var(--gain)}.cdot[data-st=syncing],.cdot[data-st=loading]{background:var(--warn)}.cdot[data-st=error],.cdot[data-st=offline]{background:var(--seal)}
.cursel{border:1px solid var(--rule);background:var(--paper2);border-radius:8px;font:600 14px var(--mono);color:var(--ink);padding:4px 6px;flex:none}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18% 6%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.sheet .sb{grid-auto-rows:max-content;align-content:start}
.field>*{min-width:0}
.amtbox{min-width:0;width:100%}
.amtbox input{width:0}
.chart .ml{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ml.se{stroke:var(--seal)}.chart .ml.si{stroke:var(--gain)}.chart .ml.sa{stroke:var(--accent)}
.chart .md{stroke:var(--paper);stroke-width:1.5}.chart .md.se{fill:var(--seal)}.chart .md.si{fill:var(--gain)}.chart .md.sa{fill:var(--accent)}
.chart .ar2{opacity:.1;stroke:none}.chart .ar2.se{fill:var(--seal)}.chart .ar2.si{fill:var(--gain)}.chart .ar2.sa{fill:var(--accent)}
.lgd{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin:0 4px 0 8px}.lgd.se{background:var(--seal)}.lgd.si{background:var(--gain)}
.tbl{display:grid;font-size:13.5px}
.tbl .tr{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:8px;padding:8px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:right;width:100%;align-items:center}
.tbl .tr>span:first-child{text-align:left;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('rec'))d.createObjectStore('rec',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    q.onsuccess=()=>{this.db=q.result;res(true)};q.onerror=()=>{this.mem=true;res(false)};}catch(e){this.mem=true;res(false)}})},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async load(){if(this.mem)return{recs:[],kv:{}};
    const t=this.db.transaction(['rec','kv']);const recs=await this.req(t.objectStore('rec').getAll());
    const ks=await this.req(t.objectStore('kv').getAllKeys());const vs=await this.req(t.objectStore('kv').getAll());
    const kv={};ks.forEach((k,i)=>kv[k]=vs[i]);return{recs,kv}},
  run(stores,fn){if(this.mem)return Promise.resolve();return new Promise((res,rej)=>{const t=this.db.transaction(stores,'readwrite');fn(t);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  putRecs(arr){return this.run(['rec'],t=>{const s=t.objectStore('rec');arr.forEach(r=>s.put(r))})},
  putKV(k,v){return this.run(['kv'],t=>t.objectStore('kv').put(v,k))},
  clear(){return this.run(['rec','kv'],t=>{t.objectStore('rec').clear();t.objectStore('kv').clear()})}
};

  const live=[],pairs=new Map(),groups=new Map(),whos=new Map(),projs=new Map();
  for(const r of S.recs){if(r.x)continue;live.push(r);
    if(r.dt<=td&&bal.has(r.a))bal.set(r.a,bal.get(r.a)+val(r));

function occDate(rule,k){
  const iv=rule.iv||1;
  if(rule.fq==='D')return addDays(rule.start,k*iv);
  if(rule.fq==='W')return addDays(rule.start,k*7*iv);
  if(rule.fq==='Y')return addMonths(rule.start,k*12*iv,+rule.start.slice(8));
  if(rule.fq==='M'&&rule.md&&rule.md.length){const L=rule.md.length,j=k+(rule.m0||0);return addMonths(rule.start.slice(0,8)+'01',Math.floor(j/L)*iv,rule.md[j%L])}
  return addMonths(rule.start,k*iv,+rule.start.slice(8));
}

function wkAdj(d,wk){if(!wk)return d;let g=0;while(isOffDay(d)&&g++<15)d=addDays(d,wk==='prev'?-1:1);return d}
const RULE_AHEAD=62;   // 週期記錄預先產生到未來幾天（未到期的顯示「未入帳」，不計入餘額）
function ruleOf(r){const m=/^(.+)_(\d+)_\d+$/.exec(r&&r.id||'');if(!m)return null;const rule=S.rules.find(x=>x.id===m[1]&&x.fq!=='I');return rule?{rule,k:+m[2]}:null}
function ruleOccDate(rule,k){return wkAdj(occDate(rule,k),rule.wk)}
function ruleNext(rule){if(!rule.on)return'';const td=TODAY();for(let k=0;k<2000;k++){if(rule.cnt&&k+(rule.off||0)>=rule.cnt)return'';const d=ruleOccDate(rule,k);if(rule.end&&d>rule.end)return'';if(d>td){if(k<rule.done){const x=S.byId.get(rule.id+'_'+k+'_0');if(!x||x.x)continue}return d}}return''}
function rulePosted(rule){const td=TODAY();let n=0;for(let k=0;k<rule.done;k++){if(ruleOccDate(rule,k)<=td)n++;else break}return n}
function ruleBuild(rule,k){const d=ruleOccDate(rule,k);const kk=rule.id+'_'+k;const rs=buildRecords({...rule.fs,dt:d,tm:rule.fs.tm||'09:00'});rs.forEach((r,i)=>{r.id=kk+'_'+i;if(r.k)r.k=kk+'_k';if(r.g)r.g=kk+'_g'});return rs}
async function runRules(){
  const td=TODAY(),to=addDays(td,RULE_AHEAD);const add=[];let changed=false,due=0;
  for(const rule of S.rules){
    if(rule.fq==='I'||!rule.on)continue;
    let guard=0;
    while(guard++<800){
      if(rule.cnt&&rule.done+(rule.off||0)>=rule.cnt)break;
      const d=ruleOccDate(rule,rule.done);
      if(d>to||(rule.end&&d>rule.end))break;
      add.push(...ruleBuild(rule,rule.done));if(d<=td)due++;
      rule.done++;changed=true;
    }
    rule.next=ruleNext(rule);
  }
  if(changed){S.rules.forEach(r=>r.u=Date.now());await saveKV('rules');if(add.length){await mutate(add);if(due)toast('已自動記入 '+due+' 筆週期記錄')}}
}
function amortize(total,n,ratePct){
  const i=ratePct/100/12;const pmt=i?total*i/(1-Math.pow(1+i,-n)):total/n;
  let rem=total;const out=[];
  for(let k=0;k<n;k++){let int=Math.round(rem*i);let pr=k===n-1?Math.round(rem):Math.round(pmt-rem*i);if(!i)pr=k===n-1?Math.round(rem):Math.round(total/n);if(i&&k===n-1)int=Math.max(0,Math.round(pmt)-pr);rem-=pr;out.push({pr,int})}
  return out;
}

function buildRecords0(fs){

  const base={dt:fs.dt,tm:fs.tm||'00:00',o:Date.now(),n:(fs.n||'').trim(),sh:'',p:(fs.p||'').trim(),ds:(fs.ds||'').trim(),tg:'',w:(fs.w||'').trim(),f:0,d:0,k:'',g:''};

      return[R({a:fs.a,t:'收入',c:fs.c,s:fs.s,m:amt,f:-fee,sh:(fs.sh||'').trim()})];
    case'tr':{const k=uid();const to=D.acct.get(fs.a2);const sub=to&&to.grp==='信用卡'?'信用卡繳款':'轉帳';
      const a2=evalAmt(fs.amt2);const inAmt=isFinite(a2)&&a2>0?a2:amt;
      return[R({a:fs.a,t:'轉出',c:'轉帳',s:sub,m:-amt,f:-fee,k}),R({a:fs.a2,t:'轉入',c:'轉帳',s:sub,m:inAmt,k,o:base.o+1})]}

}

/* ================= MOZE CSV ================= */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.length>1||r[0]!=='');
}
function guessGroup(name,cur){
  if(/信用卡/.test(name))return'信用卡';
  if(/悠遊|一卡通|iPass|icash|Line ?Pay|街口|全支付|西瓜|Suica|PayPay|Pi錢包|台灣Pay/i.test(name))return'電子支付';
  if(/證券|股票|基金|投資|複委託/.test(name))return'投資';
  if(/錢包|現金|^零錢/.test(name))return cur==='TWD'?'現金':'外幣';
  if(cur!=='TWD')return'外幣';
  return'銀行';
}
function mozeToData(text,existingAccts=[]){

function grpName(ch){const g=ch.find(x=>x.gn);if(g)return g.gn;if(ch.length>1&&ch[0].n&&ch.every(x=>x.n===ch[0].n))return ch[0].n;return''}

  if(r.t==='應收款項'||r.t==='應付款項')return r.n||(r.w?r.w+' · ':'')+r.s;
  if(r.t==='餘額調整')return r.n||'餘額調整';
  if(r.t==='支出'||r.t==='收入')return r.n||r.gn||r.s||r.c;

function subOf(r,ctx){
  const a=D.acct.get(r.a);const bits=[];
  if(r.t==='轉出'||r.t==='轉入'){const p=partner(r);const from=r.t==='轉出'?a:p&&D.acct.get(p.a);const to=r.t==='轉入'?a:p&&D.acct.get(p.a);bits.push((from?.name||'—')+' → '+(to?.name||'—'))}
  else{if(r.t==='支出'||r.t==='收入')bits.push(r.n?(r.c+(r.s?'・'+r.s:'')):r.c);else bits.push(r.t);if(ctx!=='acct'&&a)bits.push(a.name)}

  let html='',cur='',buf='',dayExp=0,dayInc=0,n=0;const flush=()=>{if(!cur)return;html+=`<section class="day"><div class="dayh"><span><span class="num">${cur.slice(5).replace('-','/')}</span> 週${wd(cur)}${cur===TODAY()?' · 今天':''}</span><span class="num">${dayExp?'支 '+shortNum(dayExp):''}${dayExp&&dayInc?'　':''}${dayInc?'收 '+shortNum(dayInc):''}</span></div>${buf}</section>`};

function niceStep(max,n=4){if(max<=0)return 1;const raw=max/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function barChart(labels,series,hi){
  const W=640,H=210,L=50,R=6,T=10,B=26;const all=series.flatMap(s=>s.vals);const max=Math.max(0,...all);const step=niceStep(max);const top=Math.max(step,Math.ceil(max/step)*step);
  const y=v=>T+(H-T-B)*(1-v/top);const gw=(W-L-R)/labels.length;const bw=Math.max(3,Math.min(16,(gw-6)/series.length));
  let g='';for(let v=0;v<=top+1e-9;v+=step){g+=`<line class="${v===0?'gl0':'gl'}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${shortNum(v)}</text>`}
  labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2;series.forEach((s,j)=>{const v=s.vals[i]||0;const x=cx-(series.length*bw)/2+j*bw;const h=Math.max(0,y(0)-y(v));
    g+=`<rect class="${s.cls} ${hi==null||hi===i?'bh':'bd'}" x="${x+.5}" y="${y(0)-h}" width="${bw-1}" height="${h}" rx="2"><title>${esc(lb)} ${esc(s.name)} ${fmt(v)}</title></rect>`});
    g+=`<text class="axc" x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="長條圖">${g}</svg>`;
}
function lineChart(labels,vals){
  const W=640,H=200,L=56,R=12,T=14,B=26;let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}
  const step=niceStep(mx-mn);const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const x=i=>L+(W-L-R)*(labels.length<2?0.5:i/(labels.length-1));const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${shortNum(v)}</text>`;
  const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  g+=`<path class="ar" d="M${x(0)},${y(lo)} L${pts.join(' L')} L${x(vals.length-1)},${y(lo)} Z"/><path class="ln" d="M${pts.join(' L')}"/>`;
  const every=Math.ceil(labels.length/6);labels.forEach((lb,i)=>{if(i%every===0||i===labels.length-1)g+=`<text class="axc" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`});
  const li=vals.length-1;g+=`<circle class="dt" cx="${x(li)}" cy="${y(vals[li])}" r="4.5"/>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="折線圖">${g}</svg>`;
}
function donut(segs,total,label){
  const R=62,C=2*Math.PI*R;let off=0,g='';const sum=segs.reduce((a,s)=>a+Math.max(0,s.v),0)||1;
  g+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--paper2)" stroke-width="22"/>`;
  for(const s of segs){if(s.v<=0)continue;const len=C*s.v/sum;g+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${s.col}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(s.n)} ${fmt(s.v)}</title></circle>`;off+=len}
  g+=`<text class="cs" x="80" y="72" text-anchor="middle">${esc(label)}</text><text class="ct" x="80" y="94" text-anchor="middle">${shortNum(total)}</text>`;
  return`<svg class="chart" viewBox="0 0 160 160" style="max-width:170px" role="img" aria-label="分類圓餅圖">${g}</svg>`;
}

function sumPeriod(pred){let exp=0,inc=0;const td=TODAY();for(const r of D.live){if(r.dt>td||!pred(r))continue;if(excluded(r))continue;const k=rateOf(curOf(r));exp+=spendOf(r)*k;inc+=incomeOf(r)*k}return{exp:Math.round(exp),inc:Math.round(inc)}}
function cardCycle(a){
  if(!a.stmt)return null;const td=TODAY();const[y,m,d]=td.split('-').map(Number);
  const stmtOf=(yy,mm)=>yy+'-'+p2(mm)+'-'+p2(Math.min(a.stmt,daysIn(yy,mm)));
  let last=stmtOf(y,m);if(last>td){const t=shiftYM(td.slice(0,7),-1).split('-').map(Number);last=stmtOf(t[0],t[1])}
  const lp=shiftYM(last.slice(0,7),-1).split('-').map(Number);const prev=stmtOf(lp[0],lp[1]);
  let due='';if(a.due){const nm=a.due>a.stmt?last.slice(0,7):shiftYM(last.slice(0,7),1);const[yy,mm]=nm.split('-').map(Number);due=yy+'-'+p2(mm)+'-'+p2(Math.min(a.due,daysIn(yy,mm)))}
  let bill=0,cyc=0,paid=0;
  for(const r of D.live){if(r.a!==a.id||r.dt>td)continue;if(r.dt>prev&&r.dt<=last&&r.t!=='轉入')bill-=val(r);if(r.dt>last){if(r.t==='轉入')paid+=val(r);else cyc-=val(r)}}
  return{last,prev,due,bill:r2(bill),paid:r2(paid),cyc:r2(cyc),remain:r2(Math.max(0,bill-paid))};
}
function reminders(){
  const out=[];const td=TODAY();
  for(const a of S.accts){if(a.arch||a.grp!=='信用卡')continue;const c=cardCycle(a);if(!c||!c.due||c.remain<=0)continue;const dd=dayDiff(td,c.due);

  if(!S.settings.sample&&D.live.length&&!synced()){const days=S.settings.lastBackup?Math.floor((Date.now()-S.settings.lastBackup)/864e5):null;
    if(days===null||days>=7)out.push(`<div class="note"><div class="grow">${days===null?'尚未備份過資料':'上次備份是 '+days+' 天前'}。資料只存在這台裝置，建議定期匯出。</div><button class="btn sm" data-act="export-json">備份</button></div>`)}

}
function budgetBlock(ym,compact){

  return h;

/* ---------- Claude 對話記帳收件匣：users/{uid}/inbox/{id} ----------
   文件欄位：kind('exp'|'inc') amt n c s a(帳戶名稱或id) dt tm p sh cu fee
   刪除週期：kind='delrule' n="週期名稱1,名稱2"（只刪由 Claude 建立的週期及未到期記錄）；週期可加 sp(JSON 字串 [{n,s,amt,c?}]) 做成一個大項含多個細項
   週期（選填）：rep('D'|'W'|'M'|'Y') iv(間隔,預設1) md(每月指定日,如 "4,8,12") cnt(總次數,0=無限) wk('prev'|'next'遇假日) ；有 rep 時 dt 為起始日，建立週期規則而非單筆                    */
let inboxBusy=Promise.resolve();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&typeof Cloud!=='undefined'&&Cloud.user)Cloud.pollInbox()});
function processInbox(docs){inboxBusy=inboxBusy.then(async()=>{
  if(!Cloud.decided){await new Promise(r=>{const t=setInterval(()=>{if(Cloud.decided){clearInterval(t);r()}},300)})}
  const add=[],dels=[],newRules=[],delNames=[];
  for(const d of docs){const x=d.data()||{};const id='ib_'+d.id;
    if(x.kind==='delrule'){String(x.n||'').split(/[,、]/).map(t=>t.trim()).filter(Boolean).forEach(t=>delNames.push(t));dels.push(d.ref);continue}
    if(!S.byId.has(id)){const amt=Math.abs(+x.amt);if(isFinite(amt)&&amt>0){
      const kind=x.kind==='inc'?'inc':'exp';const acct=S.accts.find(a=>a.id===x.a||a.name===x.a)||D.acct.get(S.settings.lastA)||S.accts.find(a=>!a.arch);
      if(acct){const ck=kind==='inc'?'inc':'exp';let c=x.c,s=x.s;const m=S.cats[ck].find(q=>q.n===c);
        if(!m||(s&&!m.subs.includes(s))){if(kind==='exp'){const g=suggestCat(x.n,x.sh);if(!m){c=g.c;s=g.s}else s=m.subs.includes(g.s)&&g.c===c?g.s:(m.subs[0]||'')}else{c=S.cats.inc[0]?.n||'收入';s=S.cats.inc[0]?.subs[0]||''}}
        const dt=/^\d{4}-\d{2}-\d{2}$/.test(x.dt||'')?x.dt:TODAY();const tm=/^\d{2}:\d{2}$/.test(x.tm||'')?x.tm:NOWTM();
        const r={id,a:acct.id,t:kind==='inc'?'收入':'支出',c,s:s||'',m:kind==='inc'?amt:-amt,f:-(Math.abs(+x.fee)||0),d:0,n:String(x.n||'').slice(0,80),sh:String(x.sh||'').slice(0,60),dt,tm,p:String(x.p||'').slice(0,60),ds:'',tg:'claude',w:'',k:'',g:'',o:Date.now()};
        if(x.cu&&x.cu!==acct.cur){r.cu=x.cu;r.xr=+(fxOn(x.cu,dt)/fxOn(acct.cur,dt)).toPrecision(6)}
        if(/^[DWMY]$/.test(x.rep||'')){
          if(!S.rules.some(q=>q.id===id)){
            let sp=null;try{const aa=typeof x.sp==='string'?JSON.parse(x.sp):x.sp;if(Array.isArray(aa)&&aa.length)sp=aa.map(q=>({c:q.c||c,s:q.s||'',amt:String(Math.abs(+q.amt)||0),n:String(q.n||'').slice(0,80)}))}catch(e){}
            const rule={id,name:r.n||r.s||'',fs:{kind,a:acct.id,c,s:s||'',amt:String(sp?sp.reduce((t,q)=>t+(+q.amt),0):amt),n:r.n,p:r.p,sh:r.sh,ds:'',w:'',tm,dt,fee:r.f?String(Math.abs(r.f)):'',disc:'',cu:r.cu||'',xr:'',ids:[],splits:sp},fq:x.rep,iv:Math.max(1,parseInt(x.iv)||1),start:dt,end:'',cnt:parseInt(x.cnt)||0,done:0,next:'',on:1,off:0,wk:(x.wk==='prev'||x.wk==='next')?x.wk:'',u:Date.now()};
            if(x.rep==='M'&&x.md){const md=[...new Set((Array.isArray(x.md)?x.md:String(x.md).split(/[,、\s]+/)).map(Number).filter(q=>q>=1&&q<=32))].sort((a,b)=>a-b);
              if(md.length){rule.md=md;const sd=+dt.slice(8),last=daysIn(+dt.slice(0,4),+dt.slice(5,7));rule.m0=md.filter(q=>Math.min(q,last)<sd).length}}
            newRules.push(rule)}
        }else add.push(r)}}}
    dels.push(d.ref)}
  if(newRules.length){S.rules.push(...newRules);await saveKV('rules');await runRules();scheduleRender();toast('Claude 幫你建了 '+newRules.length+' 個週期：'+newRules.slice(0,3).map(q=>q.name+'（'+ruleDesc(q)+'）').join('、'))}
  if(delNames.length){const td=TODAY();const gone=S.rules.filter(q=>q.fq!=='I'&&String(q.id).startsWith('ib_')&&delNames.includes(q.name));
    if(gone.length){const ids=S.recs.filter(r=>!r.x&&r.dt>td&&/_\d+_\d+$/.test(r.id)&&gone.some(q=>r.id.startsWith(q.id+'_'))).map(r=>r.id);
      S.rules=S.rules.filter(q=>!gone.includes(q));await saveKV('rules');if(ids.length)await mutate([],ids);scheduleRender();toast('Claude 幫你刪除了 '+gone.length+' 個週期')}}
  if(add.length){Cloud.inboxN=(Cloud.inboxN||0)+add.length;await mutate(add);scheduleRender();toast('Claude 幫你記了 '+add.length+' 筆：'+add.slice(0,3).map(r=>(r.n||r.s)+' '+fmt(Math.abs(r.m))).join('、'))}
  dels.forEach(ref=>ref.delete().catch(()=>{}));
}).catch(e=>{Cloud.inboxErr='處理失敗：'+(e&&e.message||e)})}

function botInfo(){return{cats:JSON.stringify({exp:S.cats.exp.map(c=>({n:c.n,subs:c.subs})),inc:S.cats.inc.map(c=>({n:c.n,subs:c.subs}))}),accts:JSON.stringify(S.accts.filter(a=>!a.arch).map(a=>({id:a.id,name:a.name,cur:a.cur,grp:a.grp}))),lastA:D.acct.get(S.settings.lastA)?.name||'',u:Date.now()}}

/* ================= 電子發票 QR（紙本證明聯）＋依歷史自動分類 =================
   規格：財政部「電子發票證明聯一維及二維條碼規格」
   左 QR：發票字軌(10) 開立日期民國yyyMMdd(7) 隨機碼(4) 銷售額hex(8) 總計hex(8) 買方統編(8) 賣方統編(8) 加密驗證(24)
          :營業人自行使用區(10):二維條碼記載品目筆數:交易品目總筆數:中文編碼(0 Big5/1 UTF-8/2 Base64):品名:數量:單價:...
   右 QR：以 ** 開頭，接續 品名:數量:單價:...                                                      */
let _jsqr=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve(window.jsQR);if(_jsqr)return _jsqr;
  _jsqr=loadScripts([window.__ARTIFACT__?'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js':'jsQR.js']).then(()=>window.jsQR);return _jsqr}
const latin1=b=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return s};
function decodeItems(bytes,enc){
  try{if(enc==='0')return new TextDecoder('big5').decode(new Uint8Array(bytes));
    if(enc==='2'){const t=atob(latin1(bytes).replace(/[^A-Za-z0-9+/=]/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(t,c=>c.charCodeAt(0)))}
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes))}catch(e){return latin1(bytes)}
}
const isLeftQR=b=>/^[A-Z]{2}\d{8}\d{7}[0-9A-Za-z]{4}[0-9a-fA-F]{16}\d{16}/.test(latin1(b.slice(0,53)));
const isRightQR=b=>b[0]===42&&b[1]===42;
function parseInvoice(left,right){
  const L=latin1(left);
  const no=L.slice(0,10),ry=+L.slice(10,13),dt=(ry+1911)+'-'+L.slice(13,15)+'-'+L.slice(15,17);
  const total=parseInt(L.slice(29,37),16),pre=parseInt(L.slice(21,29),16),buyer=L.slice(37,45),seller=L.slice(45,53);
  // colon positions in the byte stream (ASCII ':' never appears inside Big5/UTF-8 multibyte sequences)
  const cols=[];for(let i=77;i<left.length&&cols.length<5;i++)if(left[i]===58)cols.push(i);
  let enc='1',inQR=0,cnt=0,items=[];
  if(cols.length>=5){const f=L.slice(cols[0]+1,cols[4]).split(':');inQR=+f[1]||0;cnt=+f[2]||0;enc=f[3]||'1';
    let txt=decodeItems(left.slice(cols[4]+1),enc);
    if(right&&right.length>2)txt+=':'+decodeItems(right.slice(2),enc);
    const tk=txt.split(':').map(x=>x.trim());
    for(let i=0;i+2<tk.length+1;i+=3){const n=tk[i],q=parseFloat(tk[i+1]),pr=parseFloat(tk[i+2]);if(!n)continue;if(!isFinite(q)||!isFinite(pr))continue;items.push({n,q,p:pr,amt:r2(q*pr)})}}
  return{no,dt,total,pre,buyer:buyer==='00000000'?'':buyer,seller,enc,inQR,cnt,items,needRight:cnt>inQR&&!right};
}
function decodeFromCanvas(jsQR,ctx,w,h){
  const found=[];const tryRegion=(x,y,ww,hh)=>{if(ww<40||hh<40)return;const im=ctx.getImageData(x,y,ww,hh);const r=jsQR(im.data,ww,hh,{inversionAttempts:'dontInvert'});if(r&&r.binaryData&&!found.some(f=>latin1(f).slice(0,30)===latin1(r.binaryData).slice(0,30)))found.push(r.binaryData)};
  tryRegion(0,0,w,h);tryRegion(0,0,Math.round(w*0.55),h);tryRegion(Math.round(w*0.45),0,w-Math.round(w*0.45),h);
  if(found.length<2){tryRegion(0,Math.round(h*0.3),Math.round(w*0.55),Math.round(h*0.7));tryRegion(Math.round(w*0.45),Math.round(h*0.3),w-Math.round(w*0.45),Math.round(h*0.7))}
  return found;
}
async function decodeImageFile(file){
  const jsQR=await loadJsQR();const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const out=[];for(const maxW of[1400,2200,900]){const sc=Math.min(1,maxW/img.naturalWidth);const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
      for(const b of decodeFromCanvas(jsQR,ctx,w,h))if(!out.some(x=>latin1(x).slice(0,30)===latin1(b).slice(0,30)))out.push(b);
      if(out.some(isLeftQR)&&out.some(isRightQR))break}
    return out}finally{URL.revokeObjectURL(url)}
}

/* ---------- 依歷史記錄分類 ---------- */
let _clf=null;
const normName=s=>String(s||'').toLowerCase().replace(/[\s\-_*＊xX×]+\d*$/,'').replace(/[\s()（）\[\]【】.,，。'"!！?？#＃:：/／\\|+＋]/g,'').replace(/\d+(ml|g|kg|入|包|瓶|罐|個|片|顆|盒|袋|l|cc)?/gi,'');
function grams(s){const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));if(s.length===1)g.add(s);return g}
const _clfs={};
function classifier(kind='exp'){
  const key=D.live.length+'|'+(S.recs.length);if(_clfs[kind]&&_clfs[kind].key===key)return _clfs[kind];const T=kind==='inc'?'收入':'支出';
  const byName=new Map(),byShop=new Map(),gram=new Map(),total=new Map();let n=0;
  const inc=(m,k,v,w=1)=>{let x=m.get(k);if(!x)m.set(k,x=new Map());x.set(v,(x.get(v)||0)+w)};
  for(const r of D.live){if(r.t!==T||!r.c||(kind==='inc'?r.m<0:r.m>0))continue;const v=r.c+'\u0001'+(r.s||'');total.set(v,(total.get(v)||0)+1);n++;
    const nm=normName(r.n);if(nm){inc(byName,nm,v);for(const g of grams(nm))inc(gram,g,v)}
    if(r.sh)inc(byShop,normName(r.sh),v)}
  return(_clfs[kind]={key,byName,byShop,gram,total,n});
}
function suggestCat(name,shop,kind='exp'){
  const C=classifier(kind);const sc=new Map();const add=(m,w)=>{if(!m)return;let t=0;for(const v of m.values())t+=v;for(const[k,v]of m)sc.set(k,(sc.get(k)||0)+w*v/t)};
  const nm=normName(name);
  if(nm){add(C.byName.get(nm),6);const gs=grams(nm);for(const g of gs){const m=C.gram.get(g);if(!m)continue;let t=0;for(const v of m.values())t+=v;const idf=Math.log(1+C.n/t);add(m,idf/gs.size)}}
  if(shop)add(C.byShop.get(normName(shop)),2.5);
  let best=null,bv=0,sum=0;for(const[k,v]of sc){sum+=v;if(v>bv){bv=v;best=k}}
  if(!best){const t=[...C.total.entries()].sort((a,b)=>b[1]-a[1])[0];if(!t){const c=S.cats[kind][0];return{c:c?.n||'',s:c?.subs[0]||'',conf:0}}best=t[0];bv=0;sum=1}
  const exact=!!(nm&&C.byName.has(nm));
  if(kind==='inc'&&!exact){const rules=[[/加班/,'加班費'],[/年終/,'年終'],[/獎金|分紅/,'獎金'],[/股利/,'股票現金股利'],[/利息/,'利息'],[/薪/,'薪資'],[/津貼|補助|補發|代金/,'津貼']];
    for(const[re,sub]of rules)if(re.test(name)){const m=S.cats.inc.find(q=>q.subs.includes(sub));if(m)return{c:m.n,s:sub,conf:.8,exact:false}}}
  const[c,s]=best.split('\u0001');return{c,s,conf:sum?Math.min(1,bv/sum):0,exact};
}
function acctForIncome(){const cnt=new Map();let k=0;for(const r of D.live){if(r.t!=='收入')continue;cnt.set(r.a,(cnt.get(r.a)||0)+1);if(++k>60)break}let b=null,bv=0;for(const[a,v]of cnt)if(v>bv&&!D.acct.get(a)?.arch){b=a;bv=v}return b}
function acctForShop(shop){if(!shop)return null;const n=normName(shop);const cnt=new Map();let k=0;for(const r of D.live){if(r.t!=='支出'||!r.sh||normName(r.sh)!==n)continue;cnt.set(r.a,(cnt.get(r.a)||0)+1);if(++k>40)break}
  let b=null,bv=0;for(const[a,v]of cnt)if(v>bv&&!D.acct.get(a)?.arch){b=a;bv=v}return b}

/* ---------- 掃描 UI ---------- */
let scanStream=null,scanTimer=null;
function stopScan(){if(scanTimer){clearTimeout(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
async function openInvoiceScanner(){
  const live=!window.__ARTIFACT__&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
  openSheet('掃描電子發票',`<div class="hint">對準紙本發票下方<b>左右兩個 QR Code</b>，盡量讓兩個都在畫面內。品項較多的發票，右邊的 QR 也要讀到。</div>
    ${live?`<div class="scanbox"><video id="scan-v" playsinline muted autoplay></video><div class="scanframe"></div></div><div class="prog" id="scan-st">啟動相機…</div>`:''}
    <div class="btns fill"><button class="btn${live?'':' pri'}" data-act="inv-photo">拍照或選擇照片</button></div><button class="btn" data-act="rc-open">沒有 QR Code？掃描明細表文字</button>`,{onClose:stopScan});
  if(!live)return;
  try{await loadJsQR();scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){const st=$('#scan-st');if(st)st.textContent='無法使用相機（'+(e.name==='NotAllowedError'?'未允許相機權限':'裝置不支援')+'），請改用拍照';return}
  const v=$('#scan-v');if(!v){stopScan();return}v.srcObject=scanStream;await v.play().catch(()=>{});
  const c=document.createElement('canvas');const ctx=c.getContext('2d',{willReadFrequently:true});let left=null,right=null,t0=Date.now();
  const tick=()=>{if(!scanStream||!$('#scan-v'))return stopScan();
    if(v.videoWidth){const sc=Math.min(1,1280/v.videoWidth);c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);ctx.drawImage(v,0,0,c.width,c.height);
      for(const b of decodeFromCanvas(window.jsQR,ctx,c.width,c.height)){if(isLeftQR(b))left=b;else if(isRightQR(b))right=b}
      const st=$('#scan-st');
      if(left){const inv=parseInvoice(left,right);if(!inv.needRight||Date.now()-t0>12000){stopScan();showInvoiceReview(inv);return}if(st)st.textContent='已讀到左側 QR，請讓右側 QR 也入鏡…'}
      else if(st)st.textContent=right?'已讀到右側 QR，請讓左側 QR 也入鏡…':'搜尋 QR Code 中…'}
    scanTimer=setTimeout(tick,180)};
  tick();
}
async function scanFromPhoto(){
  const f=await pickFile('image/*');if(!f)return;stopScan();showBusy('辨識 QR Code…');
  try{const codes=await decodeImageFile(f);hideBusy();const left=codes.find(isLeftQR),right=codes.find(isRightQR);
    if(!left)return toast(right?'只讀到右側 QR，請讓左側 QR 清楚入鏡再拍一次':'照片中找不到電子發票 QR Code，請靠近一點、避免反光再拍');
    showInvoiceReview(parseInvoice(left,right))}catch(e){hideBusy();toast('辨識失敗：'+(e.message||e))}
}
let INV=null;
function showInvoiceReview(inv){
  const dup=inv.no?D.live.find(r=>r.tg==='inv:'+inv.no):null;
  const shop=(S.sellers||{})[inv.seller]||inv.shopGuess||'';
  const items=inv.items.length?inv.items:[{n:'',q:1,p:inv.total,amt:inv.total}];
  const kind=inv.kind||'exp';
  INV={...inv,kind,shop,a:(kind==='inc'?acctForIncome():acctForShop(shop))||S.settings.lastA||S.accts.find(a=>!a.arch)?.id,p:'',tm:inv.tm||(inv.dt===TODAY()?NOWTM():'12:00'),
    lines:items.map(it=>({...it,on:it.amt!==0})),mode:'',dup:!!dup};
  invSuggest();
  openSheet(inv.no?'發票 '+inv.no.slice(0,2)+'-'+inv.no.slice(2):'明細表','',{});renderInvoiceReview();
}
function invSuggest(){const shop=INV.shop;INV.lines.forEach(l=>{const g=suggestCat(l.n,INV.kind==='inc'?'':shop,INV.kind);Object.assign(l,{c:g.c,s:g.s,conf:g.conf,exact:g.exact})});

  let dexp=0,dinc=0;for(const r of list){if(excluded(r))continue;const k=rateOf(curOf(r));dexp+=spendOf(r)*k;dinc+=incomeOf(r)*k}

// 合併鍵：同一個群組 g；或同一天、同時間、同帳戶、同商家、同專案的多筆支出／收入（一次買好幾樣）
function gkey(r){if(r.g)return'g:'+r.dt+'|'+r.g;
  if((r.t==='支出'||r.t==='收入')&&r.tm&&r.tm!=='00:00'&&r.tg!=='autoload'&&!ruleTag(r))return'a:'+[r.dt,r.tm,r.a,r.sh||'',r.t,r.p||''].join('|');return null}

  }

function grpTitle(ch){const gn=grpName(ch);if(gn)return gn;const r=ch[0];if(r.sh)return r.sh;const ss=new Set(ch.map(x=>x.c+'・'+(x.s||'')));if(ss.size===1)return r.s||r.c;const cs=new Set(ch.map(x=>x.c));return cs.size===1?r.c:'多類別'}

/* ================= 自動加值（悠遊卡、一卡通等） =================
   帳戶設定 a.al = {on, thr, amt, from, since}
   從 since 起依時間順序計算餘額；某筆扣款後餘額低於 thr，就在同一時間補一筆「from → 卡片」的轉帳 amt 元。
   ID 固定為 al_<帳戶>_<觸發記錄>_<n>，多台裝置同時執行也不會重複；使用者刪掉的加值不會再補回。 */
let alBusy=false,alTimer=null;
function alSort(a,b){return a.dt<b.dt?-1:a.dt>b.dt?1:(a.tm||'')<(b.tm||'')?-1:(a.tm||'')>(b.tm||'')?1:(a.o||0)-(b.o||0)}
async function runAutoload(){
  if(alBusy)return 0;const td=TODAY();const add=[];
  for(const a of S.accts){const al=a.al;if(!al||!al.on||a.arch||!(al.amt>0)||!al.from||!D.acct.has(al.from)||al.from===a.id)continue;
    const since=al.since||td;let bal=a.init||0;const mine=[];const exist=new Map();
    for(const r of S.recs){if(r.a!==a.id||r.dt>td)continue;
      if(r.tg==='autoload'&&r.id.startsWith('al_'+a.id+'_')){const trg=r.id.slice(('al_'+a.id+'_').length).replace(/_\d+$/,'');(exist.get(trg)||exist.set(trg,[]).get(trg)).push(r);if(!r.x&&r.dt<since)bal+=val(r);continue}
      if(r.x)continue;if(r.dt<since)bal+=val(r);else mine.push(r)}
    mine.sort(alSort);
    for(const r of mine){bal+=val(r);
      const ex=exist.get(r.id)||[];let n=0;for(const e of ex){if(!e.x)bal+=val(e);n=Math.max(n,+e.id.split('_').pop()+1)}
      const pre='al_'+a.id+'_'+r.id+'_';if(S.byId.get(pre+n)?.x||n===0&&S.byId.get(pre+'0_o')?.x)continue;   // 使用者刪過這次加值 → 尊重
      if(val(r)>=0||bal>=al.thr)continue;
      let guard=0;while(bal<al.thr&&guard++<20){const id='al_'+a.id+'_'+r.id+'_'+n;const k='alk_'+a.id+'_'+r.id+'_'+n;n++;
        const from=D.acct.get(al.from);const sub=a.grp==='信用卡'?'信用卡繳款':'轉帳';
        const base={dt:r.dt,tm:r.tm||'00:00',o:(r.o||0)+0.5,n:'自動加值',sh:'',p:'',ds:'',tg:'autoload',w:'',f:0,d:0,g:''};
        add.push({...base,id:id+'_o',a:from.id,t:'轉出',c:'轉帳',s:sub,m:-al.amt,k},{...base,id,a:a.id,t:'轉入',c:'轉帳',s:sub,m:al.amt,k,o:base.o+0.1});
        bal+=al.amt}}
  }
  if(!add.length)return 0;
  alBusy=true;try{await mutate(add)}finally{alBusy=false}
  toast('已自動加值 '+add.length/2+' 次');return add.length/2;
}
const _mutateAL=mutate;
mutate=async function(add=[],del=[]){await _mutateAL(add,del);if(!alBusy&&S.accts.some(a=>a.al&&a.al.on)){clearTimeout(alTimer);alTimer=setTimeout(()=>runAutoload().then(n=>{if(n)render(true)}),250)}};
function alFields(a){const al=a.al||{};const opts=S.accts.filter(x=>x.id!==a.id&&!x.arch).map(x=>`<option value="${x.id}" ${al.from===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
  return`<div class="card stack" style="gap:8px;margin-top:0"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="al-on" ${al.on?'checked':''}> <b>自動加值</b><span class="hint">（悠遊卡、一卡通等）</span></label>
  <div class="grid3"><label class="field"><span>餘額低於</span><input class="in num" id="al-thr" inputmode="decimal" value="${al.thr??100}"></label><label class="field"><span>自動加值</span><input class="in num" id="al-amt" inputmode="decimal" value="${al.amt??500}"></label><label class="field"><span>扣款帳戶</span><select class="in" id="al-from"><option value="">選擇</option>${opts}</select></label></div>
  <div class="hint">每次扣款後餘額低於門檻，就自動記一筆「扣款帳戶 → 本卡」的轉帳（可在明細中修改或刪除）。只會從啟用當天${al.since?'（'+al.since.replace(/-/g,'/')+'）':''}之後開始計算。</div></div>`}
function alRead(a){const on=$('#al-on')?.checked;if(on==null)return;const thr=evalAmt($('#al-thr').value),amt=evalAmt($('#al-amt').value),from=$('#al-from').value;
  if(on&&(!(amt>0)||!from))return'自動加值請填加值金額並選擇扣款帳戶';
  const prev=a.al||{};const changed=!prev.on&&on||prev.thr!==thr||prev.amt!==amt||prev.from!==from;
  a.al={on:!!on,thr:isFinite(thr)?thr:100,amt:amt||500,from,since:on?(changed||!prev.since?TODAY():prev.since):prev.since||''}}

/* ---------- 記錄收回／還款後，若只剩零頭或多收 → 問要不要繼續追蹤 ---------- */
const _mutateDK=mutate;
mutate=async function(add=[],del=[]){await _mutateDK(add,del);
  const pays=add.filter(r=>r&&!r.x&&(r.t==='應收款項'&&r.m>0||r.t==='應付款項'&&r.m<0));if(!pays.length)return;

/* ================= 週期與分期總覽：剩餘期數、未來預計支出／收入／轉帳 ================= */
function rulePerMonth(r){const iv=r.iv||1;return r.fq==='D'?30/iv:r.fq==='W'?30/7/iv:r.fq==='Y'?1/12/iv:1/iv}
function ruleKind(fs){return fs.kind==='inc'?'收入':fs.kind==='tr'?'轉帳':'支出'}
function ruleAmtTWD(fs){const a=D.acct.get(fs.a);const cur=fs.cu||a?.cur||'TWD';const v=fs.kind==='exp'&&fs.splits?fs.splits.reduce((s,x)=>s+(evalAmt(x.amt)||0),0):(evalAmt(fs.amt)||0);return{v,cur,twd:v*rateOf(cur)}}
function upcoming(days){const td=TODAY(),to=addDays(td,days);const out=[];
  for(const r of S.rules){if(r.fq==='I'){for(const x of(D.groups.get(r.id)||[])){if(x.x||x.dt<=td||x.dt>to)continue;out.push({dt:x.dt,n:r.name+(x.t==='利息'?'（利息）':''),k:'支出',twd:Math.abs(x.m)*rateOf(curOf(x)),tag:'分期',a:D.acct.get(x.a)?.name||''})}continue}
    if(!r.on)continue;
    for(let k=0;k<2000;k++){if(r.cnt&&k+(r.off||0)>=r.cnt)break;const d=ruleOccDate(r,k);if(d>to||(r.end&&d>r.end))break;if(d<=td)continue;
      let twd,n=r.name||r.fs.n||r.fs.s||ruleKind(r.fs),an=D.acct.get(r.fs.a)?.name||'';
      if(k<r.done){const xs=S.recs.filter(x=>!x.x&&x.id.startsWith(r.id+'_'+k+'_')&&x.t!=='轉入');if(!xs.length)continue;twd=xs.reduce((s,x)=>s+Math.abs(val(x))*rateOf(curOf(x)),0);n=xs[0].n||n;an=D.acct.get(xs[0].a)?.name||an}
      else twd=ruleAmtTWD(r.fs).twd;
      out.push({dt:d,n,k:ruleKind(r.fs),twd,tag:'週期',a:an})}}
  return out.sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0)}
function pageRules(){
  const td=TODAY();const rs=S.rules.filter(r=>r.fq!=='I');const ins=S.rules.filter(r=>r.fq==='I');
  const H=S.schedDays||30;const up=upcoming(H);const sum=k=>Math.round(up.filter(x=>x.k===k).reduce((s,x)=>s+x.twd,0));
  // 分期
  const inst=ins.map(r=>{const gs=(D.groups.get(r.id)||[]).filter(x=>!x.x);const pr=gs.filter(x=>x.t==='支出').sort((a,b)=>a.dt<b.dt?-1:1);
    const off=r.off||0;const paid0=pr.filter(x=>x.dt<=td).length;const paidN=paid0+off;const fut=gs.filter(x=>x.dt>td);const left=pr.length-paid0;const remain=fut.reduce((s,x)=>s-x.m,0);const next=pr.find(x=>x.dt>td);const per=next?gs.filter(x=>x.dt===next.dt).reduce((s,x)=>s-x.m,0):0;
    return{r,n:r.n||pr.length,paidN,left,remain,next:next?.dt||'',per,end:pr.length?pr[pr.length-1].dt:'',a:D.acct.get(r.a)?.name||''}});
  const act=inst.filter(x=>x.left>0).sort((a,b)=>(a.next<b.next?-1:1)),fin=inst.filter(x=>x.left<=0);
  const totRemain=Math.round(act.reduce((s,x)=>s+x.remain,0));const totPer=Math.round(act.reduce((s,x)=>s+x.per,0));
  const instLi=o=>`<div class="li sch"><div class="grow"><div>${esc(o.r.name)}${o.left>0?'':'<span class="pill">已繳清</span>'}</div>
    <div class="pbar"><i style="width:${Math.round(o.paidN/Math.max(1,o.n)*100)}%"></i></div>
    <small class="num">已繳 ${o.paidN} / ${o.n} 期${o.left>0?` · 剩 ${o.left} 期 · 剩餘 ${money(Math.round(o.remain))}`:''}</small>
    <small class="num">${o.left>0?`每期約 ${money(Math.round(o.per))} · 下一期 ${o.next.replace(/-/g,'/')} · 到 ${o.end.replace(/-/g,'/')}`:`總額 ${money(o.r.total)} · ${o.end.replace(/-/g,'/')} 結束`}${o.a?' · '+esc(o.a):''}</small></div>
    <button class="btn sm danger" data-act="inst-del" data-id="${o.r.id}">刪除</button></div>`;
  // 週期
  const kinds=['支出','收入','轉帳'];const mEq=k=>Math.round(rs.filter(r=>r.on&&ruleNext(r)&&ruleKind(r.fs)===k).reduce((s,r)=>s+ruleAmtTWD(r.fs).twd*rulePerMonth(r),0));
  const ruleLi=r=>{const am=ruleAmtTWD(r.fs);const a=D.acct.get(r.fs.a),a2=D.acct.get(r.fs.a2);const k=ruleKind(r.fs);
    return`<div class="li sch"><div class="grow"><div>${esc(r.name||r.fs.n||r.fs.s||k)}<span class="pill">${k}</span>${r.on?'':'<span class="pill warn">已暫停</span>'}</div>
    <small class="num">${ruleDesc(r)} · ${money(am.v,am.cur)} · ${esc(a?.name||'')}${k==='轉帳'&&a2?' → '+esc(a2.name):''}</small>
    <small class="num">${ruleNext(r)?'下次 '+ruleNext(r).replace(/-/g,'/'):(r.on?'已結束':'已暫停')} · 已入帳 ${rulePosted(r)+(r.off||0)} 次${r.cnt?` · 剩 ${Math.max(0,r.cnt-(r.off||0)-rulePosted(r))} 次`:(r.end?'':' · 無限期')}</small></div>
    <button class="btn sm" data-act="rule-toggle" data-id="${r.id}">${r.on?'暫停':'啟用'}</button><button class="btn sm danger" data-act="rule-del" data-id="${r.id}">刪除</button></div>`};
  const upRows=up.slice(0,60).map(x=>`<div class="li"><div class="grow"><div>${esc(x.n)}<span class="pill">${x.tag}</span></div><small class="num">${x.dt.slice(5).replace('-','/')} 週${WD[new Date(+x.dt.slice(0,4),+x.dt.slice(5,7)-1,+x.dt.slice(8)).getDay()]}${x.a?' · '+esc(x.a):''}</small></div><div class="r num ${x.k==='支出'?'neg':x.k==='收入'?'pos':''}">${money(Math.round(x.twd))}</div></div>`).join('');
  return{back:1,head:`<h1>週期與分期</h1>`,body:`
  <div class="sum"><div class="toolbar" style="margin:0"><div class="lbl">未來 ${H} 天預計</div><div class="seg">${[30,60,90].map(d=>`<button class="${H===d?'on':''}" data-act="sched-days" data-d="${d}">${d} 天</button>`).join('')}</div></div>
    <div class="kv mt"><div><div class="lbl">支出</div><div class="v num neg">${money(sum('支出'))}</div></div><div><div class="lbl">收入</div><div class="v num pos">${money(sum('收入'))}</div></div><div><div class="lbl">轉帳</div><div class="v num">${money(sum('轉帳'))}</div></div></div>
    <div class="hint mt">分期進行中 ${act.length} 筆，尚未繳的總額 <span class="num">${money(totRemain)}</span>${act.length?`，下一期合計約 <span class="num">${money(totPer)}</span>`:''}。</div></div>
  ${pendHTML()?`<div class="stack" style="margin-top:14px">${pendHTML()}</div>`:''}
  <div class="grp"><div class="grph"><span>分期付款 · 進行中（${act.length}）</span><span class="num">剩 ${money(totRemain)}</span></div><div class="list">${act.length?act.map(instLi).join(''):'<div class="empty" style="padding:18px 0">沒有進行中的分期。記帳時把「記帳方式」切到「分期」即可建立。</div>'}</div></div>
  ${fin.length?`<div class="grp"><button class="grph" data-act="sched-fin" style="width:100%;border:0;background:none;cursor:pointer"><span>分期付款 · 已繳清（${fin.length}）</span><span>${S.schedFin?'收合':'展開'}</span></button>${S.schedFin?`<div class="list">${fin.map(instLi).join('')}</div>`:''}</div>`:''}
  <div class="grp"><div class="grph"><span>週期記錄（${rs.length}）</span><span class="num">每月約 支 ${shortNum(mEq('支出'))}・收 ${shortNum(mEq('收入'))}・轉 ${shortNum(mEq('轉帳'))}</span></div><div class="list">${rs.length?rs.slice().sort((a,b)=>(ruleNext(a)||'9')<(ruleNext(b)||'9')?-1:1).map(ruleLi).join(''):'<div class="empty" style="padding:18px 0">沒有週期記錄。記帳時把「記帳方式」切到「週期」即可建立，例如房租、訂閱、薪資、固定轉帳。</div>'}</div></div>
  <div class="grp"><div class="grph"><span>未來 ${H} 天明細（${up.length}）</span><span></span></div><div class="list">${upRows||'<div class="empty" style="padding:18px 0">這段期間沒有預計的週期或分期。</div>'}</div></div>
  <div class="hint mt">這裡只會列出在這個 App 建立的週期與分期；從 MOZE 匯入的舊記錄沒有帶排程資訊，需要的話請在記帳時重新建立一次。</div>`};
}

/* ================= 掃明細：拍照或選照片 → 在手機上自動辨識文字（Tesseract.js，離線運算，不上傳照片）→ 逐項確認 =================
   兩階段辨識：① 中文＋英數整頁（抓品名與同一行內的數字）② 只認數字的稀疏模式（抓右側獨立的金額欄），再依位置合併。 */
const TESS_VER='5.1.1';let _tess=null,_wA=null,_wB=null,OCR_LAST=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(_tess)return _tess;
  _tess=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@'+TESS_VER+'/dist/tesseract.min.js';s.onload=()=>res();s.onerror=()=>{_tess=null;rej(new Error('無法載入文字辨識元件（需要連網一次）'))};document.head.appendChild(s)});return _tess}
async function imgCanvas(file,max){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('讀不到這張照片'));im.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height;const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.drawImage(bmp,0,0,c.width,c.height);
  // 灰階＋拉開對比，讓感熱紙的淡字清楚一點
  const d=g.getImageData(0,0,c.width,c.height);const p=d.data;let lo=255,hi=0;const hist=new Uint32Array(256);for(let i=0;i<p.length;i+=4){const v=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=v;hist[v]++}
  const n=p.length/4;let acc=0;for(let v=0;v<256;v++){acc+=hist[v];if(acc>n*0.02){lo=v;break}}acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>n*0.05){hi=v;break}}const sc=255/Math.max(40,hi-lo);
  for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-lo)*sc));p[i]=p[i+1]=p[i+2]=v}g.putImageData(d,0,0);return c}
const CJK=/[㐀-鿿豈-﫿぀-ヿ]/;
function ocrWords(data){const out=[];for(const b of data.blocks||[])for(const pg of b.paragraphs||[])for(const l of pg.lines||[])out.push(l);return out}
function ocrMerge(A,B){
  const nums=[];for(const l of ocrWords(B))for(const w of l.words||[]){const t=(w.text||'').replace(/[xX$]/g,'').replace(/[.,]$/,'');if(/^-?\d[\d,]*(\.\d+)?$/.test(t)&&w.confidence>=60)nums.push({t,x0:w.bbox.x0,x1:w.bbox.x1,yc:(w.bbox.y0+w.bbox.y1)/2,used:0})}
  const lines=[];
  for(const l of ocrWords(A)){const ws=(l.words||[]).filter(w=>(w.text||'').trim());if(!ws.length)continue;
    const hs=ws.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b);const lh=hs[hs.length>>1]||20;
    const bl=l.baseline||{};const slope=bl.x1!==bl.x0&&isFinite((bl.y1-bl.y0)/(bl.x1-bl.x0))?(bl.y1-bl.y0)/(bl.x1-bl.x0):0;
    const xm=(l.bbox.x0+l.bbox.x1)/2;const cys=ws.map(w=>(w.bbox.y0+w.bbox.y1)/2-slope*((w.bbox.x0+w.bbox.x1)/2-xm)).sort((a,b)=>a-b);const ym=cys[cys.length>>1];const yAt=x=>ym+slope*(x-xm);
    // 品名區＝從行首到第一個大空隙為止；空隙右邊視為金額欄（中文模型常把那裡的數字認成怪字，改用數字階段的結果）
    let last=ws.length-1;for(let i=0;i<ws.length-1;i++){if(ws[i+1].bbox.x0-ws[i].bbox.x1>lh*2.2){last=i;break}}
    if(!ws.slice(0,last+1).some(w=>CJK.test(w.text)||/[A-Za-z]{2,}/.test(w.text)))last=-1;
    let keep=ws,tail=[];
    if(last>=0){const xc=ws[last].bbox.x1;const cand=nums.filter(n=>!n.used&&n.x0>xc+lh*0.3&&Math.abs(n.yc-yAt((n.x0+n.x1)/2))<lh*0.55).sort((a,b)=>a.x0-b.x0);
      if(cand.length){cand.forEach(n=>n.used=1);keep=ws.slice(0,last+1);tail=cand.map(n=>n.t)}}
    let s='';keep.forEach((w,i)=>{const t=w.text.trim();if(i){const pv=keep[i-1];const gap=w.bbox.x0-pv.bbox.x1;const glue=CJK.test(pv.text.slice(-1))&&CJK.test(t[0])&&gap<lh*0.7;s+=glue?'':' '}s+=t});
    const txt=(s+' '+tail.join(' ')).trim();if(txt)lines.push({y:ym,t:txt})}
  return lines.sort((a,b)=>a.y-b.y).map(x=>x.t).join('\n')}
function ocrDate(txt){let m=/(20\d{2})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/.exec(txt);if(m)return m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]);m=/(1\d{2})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/.exec(txt);if(m)return(+m[1]+1911)+'-'+p2(+m[2])+'-'+p2(+m[3]);return''}
async function ocrReceipt(file,prog){
  await loadTess();prog('準備照片…',0.02);const cv=await imgCanvas(file,1800);
  const lg=(base,span,label)=>m=>{if(m.status==='recognizing text')prog(label,base+span*(m.progress||0));else if(/load|initial/.test(m.status||''))prog('載入辨識元件（第一次約 6 MB，之後不用再下載）…',Math.min(base,0.05+0.25*(m.progress||0)))};
  if(!_wA){_wA=await Tesseract.createWorker(['chi_tra','eng'],1,{logger:m=>_wA_log&&_wA_log(m)});await _wA.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'})}
  _wA_log=lg(0.3,0.4,'辨識品名…');const A=await _wA.recognize(cv,{},{blocks:true,text:true});
  if(!_wB){_wB=await Tesseract.createWorker('eng',1,{logger:m=>_wB_log&&_wB_log(m)});await _wB.setParameters({tessedit_pageseg_mode:'11',tessedit_char_whitelist:'0123456789,.-$xX'})}
  _wB_log=lg(0.7,0.28,'辨識金額…');const B=await _wB.recognize(cv,{},{blocks:true,text:true});
  prog('整理結果…',0.99);const text=ocrMerge(A.data,B.data);return{text,conf:Math.round(A.data.confidence||0),thumb:cv.toDataURL('image/jpeg',0.5)}}
let _wA_log=null,_wB_log=null;
function pickReceiptPhoto(camera){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(camera)inp.setAttribute('capture','environment');inp.style.display='none';document.body.appendChild(inp);
  inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];inp.remove();if(f)runReceiptOCR(f)});inp.click();setTimeout(()=>{if(!inp.files||!inp.files.length)inp.isConnected&&0},0)}
async function runReceiptOCR(file){
  try{stopScan()}catch(e){}
  openSheet('辨識明細中',`<div class="prog" id="ocr-msg">準備中…</div><div class="pbar" style="margin:14px 0"><i id="ocr-bar" style="width:2%"></i></div><div class="hint">辨識在你的手機上進行，照片不會上傳。一般約 5～20 秒。</div>`,{noClose:1});
  const prog=(m,p)=>{const a=$('#ocr-msg'),b=$('#ocr-bar');if(a)a.textContent=m;if(b)b.style.width=Math.round(Math.max(2,Math.min(100,p*100)))+'%'};
  try{const r=await ocrReceipt(file,prog);OCR_LAST=r;const v=parseReceiptText(r.text);const d=ocrDate(r.text);if(d&&d<=TODAY()&&d>=addDays(TODAY(),-400))v.dt=d;const tmm=/(?:^|[^\d:])([01]?\d|2[0-3])[:：]([0-5]\d)(?![\d])/.exec(r.text);if(v.dt===d&&d&&tmm)v.tm=p2(+tmm[1])+':'+tmm[2];v.ocr=1;v.ocrText=r.text;v.ocrConf=r.conf;
    closeSheet();setTimeout(()=>{if(v.items.length)showInvoiceReview(v);else openReceiptText(r.text,'照片裡沒有找到「品名＋金額」的行，可以直接在下面修改辨識結果，或重拍一張。')},260)}
  catch(e){closeSheet();setTimeout(()=>openReceiptText('',(e&&e.message)||'辨識失敗，請再試一次'),260)}}
Object.assign(ACT,{
  'rc-open':()=>pickReceiptPhoto(true),
  'rc-cam':()=>{closeSheet();pickReceiptPhoto(true)},
  'rc-lib':()=>{closeSheet();pickReceiptPhoto(false)},
  'rc-text-open':()=>{const t=(INV&&INV.ocrText)||(OCR_LAST&&OCR_LAST.text)||'';closeSheet();setTimeout(()=>openReceiptText(t),260)}
});

  clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=Date.now();S.search.selMode=true;S.search.sel.clear();S.search.sel.add(row.dataset.id);if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}render(true)},480)});
document.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)){clearTimeout(lpT);lpT=null}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null}));

/* ================= 金額計算機鍵盤：+ − × ÷，觸控裝置取代系統數字鍵盤 ================= */
const CALC_TOUCH=matchMedia('(pointer:coarse)').matches;
const CALC_IM=CALC_TOUCH?'none':'decimal';
let CK=null;   // 目前輸入中的欄位
const CALC_KEYS=[['AC','÷','×','⌫'],['7','8','9','−'],['4','5','6','+'],['1','2','3','='],['00','0','.','完成']];
function calcEl(){let k=$('#calc');if(k)return k;k=document.createElement('div');k.id='calc';k.className='calc';k.hidden=true;
  k.innerHTML=`<div class="calc-pv" id="calc-pv"></div><div class="calc-g">${CALC_KEYS.flat().map(x=>`<button type="button" data-ck="${x}" class="${/^[÷×−+=]$/.test(x)?'op':x==='完成'?'ok':x==='AC'||x==='⌫'?'fn':''}">${x}</button>`).join('')}</div>`;
  document.body.appendChild(k);
  k.addEventListener('pointerdown',e=>{e.preventDefault();const b=e.target.closest('[data-ck]');if(b)calcKey(b.dataset.ck)});
  k.addEventListener('mousedown',e=>e.preventDefault());return k}
function calcPv(){const pv=$('#calc-pv');if(!pv||!CK)return;const v=CK.value;const ev=evalAmt(v);
  pv.textContent=/[+\-−*/×÷]/.test(v.slice(1))&&isFinite(ev)?v+' = '+fmt(r2(ev)):v||'0'}
function calcSet(v){if(!CK)return;CK.value=v;CK.dispatchEvent(new Event('input',{bubbles:true}));calcPv()}
function calcKey(k){if(!CK)return;let v=CK.value;const last=v.slice(-1),isOp=c=>/[+−\-×÷*/]/.test(c);
  if(k==='AC')return calcSet('');
  if(k==='⌫')return calcSet(v.slice(0,-1));
  if(k==='='||k==='完成'){const ev=evalAmt(v);if(v&&isFinite(ev))calcSet(String(r2(ev)));if(k==='完成'){const el=CK;calcHide();el.blur();el.dispatchEvent(new Event('change',{bubbles:true}))}return}
  if(isOp(k)){if(!v&&k!=='−')return;if(isOp(last))v=v.slice(0,-1);return calcSet(v+k)}
  if(k==='.'){const seg=v.split(/[+−\-×÷*/]/).pop();if(seg.includes('.'))return;return calcSet(v+(seg?'.':'0.'))}
  calcSet(v+k)}
function calcShow(el){CK=el;const k=calcEl();k.hidden=false;document.body.classList.add('calc-on');calcPv();
  setTimeout(()=>{const r=el.getBoundingClientRect(),kt=k.getBoundingClientRect().top;const sb=el.closest('#sb');if(sb&&(r.bottom>kt-12||r.top<80))sb.scrollBy({top:r.bottom-(kt-24),behavior:'smooth'})},60)}
function calcHide(){const k=$('#calc');if(k)k.hidden=true;document.body.classList.remove('calc-on');CK=null}
if(CALC_TOUCH){
  document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input[data-calc]'))calcShow(e.target);else if(CK&&!e.target.closest('#calc'))calcHide()});
  document.addEventListener('focusout',e=>{if(e.target===CK)setTimeout(()=>{if(CK&&document.activeElement!==CK)calcHide()},60)});
}
// 減號在輸入框顯示「−」，算式解析時當成一般減號
const _evalAmtC=evalAmt;evalAmt=function(src){return _evalAmtC(String(src??'').replace(/−/g,'-'))};

boot();
</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      const ask=w=>{const t=document.createElement('div');t.className='toast';t.style.cursor='pointer';t.textContent='有新版本，點此更新';t.onclick=()=>w.postMessage('skip');document.body.appendChild(t)};
      if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})});
    }).catch(()=>{});
    let r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!r){r=true;location.reload()}});
  });
}
</script>
</body>
</html>
