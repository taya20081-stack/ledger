name: 推播提醒
on:
  schedule:
    - cron: '7 * * * *'      # 每小時檢查一次
  workflow_dispatch:
permissions:
  contents: write
concurrency: push-reminder
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pywebpush
      - name: 發送到期的提醒
        env:
          API_KEY: AIzaSyBJXlXSuctjCBbOifJX8DpewQ869cEcLxo   # 與網站 index.html 內相同，本來就是公開的
          PROJECT: money-app-54e0d
          OWNER_UID: ${{ secrets.OWNER_UID }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          python3 - <<'PY'
          import json, os, hashlib, datetime, urllib.request
          from pywebpush import webpush, WebPushException
          E = os.environ
          if not all(E.get(k) for k in ('OWNER_UID', 'BOT_EMAIL', 'BOT_PASSWORD', 'VAPID_PRIVATE')):
              print('推播密鑰尚未設定完整，略過'); raise SystemExit(0)
          TW = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(TW)
          def post(url, body, hdr=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={'Content-Type': 'application/json', 'Referer': 'https://taya20081-stack.github.io/ledger/', **(hdr or {})})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          tok = post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + E['API_KEY'],
                     {'email': E['BOT_EMAIL'], 'password': E['BOT_PASSWORD'], 'returnSecureToken': True})['idToken']
          url = 'https://firestore.googleapis.com/v1/projects/%s/databases/(default)/documents/users/%s/kv/notify' % (E['PROJECT'], E['OWNER_UID'])
          try:
              doc = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization': 'Bearer ' + tok, 'Referer': 'https://taya20081-stack.github.io/ledger/'}), timeout=30).read())
          except urllib.error.HTTPError as e:
              print('讀取提醒排程失敗', e.code, '（403＝Firestore 規則尚未更新）'); raise SystemExit(0 if e.code in (403, 404) else 1)
          f = doc.get('fields', {})
          subs = json.loads(f.get('subs', {}).get('stringValue', '[]'))
          items = json.loads(f.get('items', {}).get('stringValue', '[]'))
          path = 'push-sent.json'
          sent = json.load(open(path)) if os.path.exists(path) else {}
          cut = (now - datetime.timedelta(days=40)).strftime('%Y-%m-%d')
          sent = {k: v for k, v in sent.items() if v >= cut}
          due = []
          for it in items:
              at = datetime.datetime.strptime(it['at'], '%Y-%m-%dT%H:%M').replace(tzinfo=TW)
              h = hashlib.sha256((E['OWNER_UID'] + '|' + it['id']).encode()).hexdigest()[:20]
              if at <= now and now - at < datetime.timedelta(hours=20) and h not in sent:
                  due.append((h, it))
          print('裝置', len(subs), '台，排程', len(items), '則，到期', len(due), '則')
          for h, it in due:
              ok = False
              for s in subs:
                  try:
                      webpush(subscription_info={'endpoint': s['endpoint'], 'keys': s['keys']},
                              data=json.dumps({'title': it['t'], 'body': it['b'], 'tag': it['id']}, ensure_ascii=False),
                              vapid_private_key=E['VAPID_PRIVATE'], vapid_claims={'sub': 'mailto:' + E.get('VAPID_SUB', 'noreply@example.com')}, ttl=43200)
                      ok = True
                  except WebPushException as e:
                      print('  發送失敗', getattr(e.response, 'status_code', ''), str(e)[:120])
              if ok:
                  sent[h] = now.strftime('%Y-%m-%d'); print('  已送出 1 則')
          json.dump(sent, open(path, 'w'), separators=(',', ':'))
          PY
      - name: 記錄已送出的提醒（只存雜湊，不含內容）
        run: |
          git config user.name 'github-actions'; git config user.email 'actions@users.noreply.github.com'
          git add push-sent.json
          git diff --cached --quiet || (git commit -m "push log" && git push)
