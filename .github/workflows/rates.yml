name: 臺灣銀行匯率
on:
  schedule:
    - cron: '35 8 * * 1-5'    # 週一至週五 16:35（台灣時間），臺銀收盤後
    - cron: '5 16 * * *'      # 每天 00:05（台灣時間）補抓一次
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取臺灣銀行現金買入匯率
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          TW = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(TW)
          today = now.strftime('%Y-%m-%d')
          path = 'rates.json'
          data = json.load(open(path, encoding='utf-8')) if os.path.exists(path) else {'d': {}}
          data.setdefault('d', {})
          CURS = ['USD','HKD','GBP','AUD','CAD','SGD','CHF','JPY','ZAR','SEK','NZD','THB','PHP','IDR','EUR','KRW','VND','MYR','CNY']
          HDR = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
                 'Accept': 'text/csv,text/html,application/json,*/*', 'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8', 'Referer': 'https://rate.bot.com.tw/xrt?Lang=zh-TW'}
          def get(url):
              req = urllib.request.Request(url, headers=HDR)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode('utf-8-sig', 'ignore')
          def sane(r):
              return bool(r) and 20 < r.get('USD', 0) < 50
          # 來源 1：臺灣銀行牌告 CSV（指定日期的最後一筆掛牌）
          def bot(day):
              st, txt = get('https://rate.bot.com.tw/xrt/flcsv/0/' + day)
              out = {}
              for line in txt.splitlines()[1:]:
                  c = [x.strip() for x in line.split(',')]
                  if len(c) < 4 or len(c[0]) != 3:
                      continue
                  try:
                      v = float(c[2])          # 第 3 欄：現金匯率・本行買入
                  except ValueError:
                      continue
                  if v > 0:
                      out[c[0]] = v
              if not sane(out):
                  print('  臺銀回應不是匯率表：status', st, 'len', len(txt), repr(txt[:120]))
              return out
          # 來源 2：FinMind 開放資料（資料來源同為臺灣銀行牌告，欄位 cash_buy＝現金買入）
          def finmind(days):
              start, end = min(days), max(days)
              res = {d: {} for d in days}
              for cur in CURS:
                  try:
                      st, txt = get('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanExchangeRate&data_id=%s&start_date=%s&end_date=%s' % (cur, start, end))
                      rows = json.loads(txt).get('data', [])
                  except Exception as e:
                      print('  FinMind 失敗', cur, e)
                      continue
                  for row in rows:
                      d = row.get('date'); v = row.get('cash_buy')
                      if d in res and isinstance(v, (int, float)) and v > 0:
                          res[d][cur] = v
              return res
          days = []
          if now.weekday() < 5 and now.hour >= 16:      # 今天：16:00 收盤後才記錄
              days.append(today)
          for i in range(1, 11):                        # 補抓前 10 天缺少的營業日
              d = now - datetime.timedelta(days=i)
              if d.weekday() < 5:
                  days.append(d.strftime('%Y-%m-%d'))
          need = [d for d in days if d == today or len(data['d'].get(d, {})) < 12]
          print('需要抓取：', need)
          miss = []
          for day in need:
              try:
                  r = bot(day)
              except Exception as e:
                  print('  臺銀連線失敗', day, repr(e)); r = {}
              if sane(r):
                  data['d'][day] = r; print('ok 臺銀', day, 'USD', r.get('USD'), len(r), '個幣別')
              else:
                  miss.append(day)
          if miss:
              print('改用 FinMind：', miss)
              fm = finmind(miss)
              for day in miss:
                  r = fm.get(day, {})
                  if sane(r):
                      data['d'][day] = {**data['d'].get(day, {}), **r}; print('ok FinMind', day, 'USD', r.get('USD'), len(r), '個幣別')
                  else:
                      print('skip', day, '（假日或兩個來源都沒有資料）')
          keep = sorted(data['d'])[-400:]
          data['d'] = {k: data['d'][k] for k in keep}
          data['updated'] = now.strftime('%Y-%m-%d %H:%M')
          data['source'] = '臺灣銀行牌告匯率・現金買入'
          json.dump(data, open(path, 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          print('目前共有', len(data['d']), '天：', keep[-6:])
          PY
      - name: 存回 rates.json
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "更新臺灣銀行匯率"
          git push
