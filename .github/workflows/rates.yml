name: 臺灣銀行匯率
on:
  schedule:
    - cron: '35 8 * * 1-5'    # 週一至週五 16:35（台灣時間），臺銀收盤後
    - cron: '5 16 * * *'      # 每天 00:05（台灣時間）補抓一次
  workflow_dispatch:
  workflow_call:   # 每天 14:25 由 prices.yml（外部排程觸發）一併呼叫
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    concurrency:   # 匯率自己的排隊群組（與 prices 不同，避免互等；放在 job 層，被 prices.yml 呼叫時也有效）
      group: rates-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 抓取臺灣銀行現金買入匯率
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          from scripts.bank_rates import CURRENCIES, accept, complete, parse_csv, valid_rate
          TW = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(TW)
          today = now.strftime('%Y-%m-%d')
          path = 'rates.json'
          data = json.load(open(path, encoding='utf-8')) if os.path.exists(path) else {'d': {}}
          data.setdefault('d', {})
          HDR = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
                 'Accept': 'text/csv,text/html,application/json,*/*', 'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8', 'Referer': 'https://rate.bot.com.tw/xrt?Lang=zh-TW'}
          def get(url):
              req = urllib.request.Request(url, headers=HDR)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode('utf-8-sig', 'ignore')
          # 日期由臺銀指定日端點選擇，CSV 本身沒有可再驗證的日期欄。
          def bot(day):
              _, txt = get('https://rate.bot.com.tw/xrt/flcsv/0/' + day)
              return parse_csv(txt)
          # 來源 2：FinMind 開放資料（資料來源同為臺灣銀行牌告，欄位 cash_buy＝現金買入）
          def finmind(days):
              start, end = min(days), max(days)
              res = {d: {} for d in days}
              for cur in sorted(CURRENCIES):
                  try:
                      st, txt = get('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanExchangeRate&data_id=%s&start_date=%s&end_date=%s' % (cur, start, end))
                      result = json.loads(txt)
                      rows = result['data'] if result.get('status') == 200 else []
                      if not isinstance(rows, list): continue
                  except Exception as e:
                      print('  FinMind 失敗', cur, type(e).__name__)
                      continue
                  for row in rows:
                      if not isinstance(row, dict): continue
                      d = row.get('date'); v = row.get('cash_buy')
                      if isinstance(d, str) and d in res and row.get('currency') == cur and valid_rate(v):
                          res[d][cur] = v
              return res
          days = []
          if now.weekday() < 5 and now.hour >= 16:      # 今天：16:00 收盤後才記錄
              days.append(today)
          for i in range(1, 11):                        # 補抓前 10 天缺少的營業日
              d = now - datetime.timedelta(days=i)
              if d.weekday() < 5:
                  days.append(d.strftime('%Y-%m-%d'))
          need = [d for d in days if d == today or not complete(data['d'].get(d, {}))]
          print('需要抓取：', need)
          miss = []
          previous = data['d'].copy()
          for day in need:
              try:
                  r = bot(day)
              except Exception as e:
                  print('  臺銀連線失敗', day, repr(e)); r = {}
              if complete(r):
                  data['d'][day] = accept(data['d'].get(day, {}), r); print('ok 臺銀', day, 'USD', r.get('USD'), len(r), '個幣別')
              else:
                  miss.append(day)
          if miss:
              print('改用 FinMind：', miss)
              fm = finmind(miss)
              for day in miss:
                  r = fm.get(day, {})
                  if complete(r):
                      data['d'][day] = accept(data['d'].get(day, {}), r); print('ok FinMind', day, 'USD', r.get('USD'), len(r), '個幣別')
                  else:
                      print('skip', day, '（假日或兩個來源都沒有資料）')
          keep = sorted(data['d'])[-400:]
          data['d'] = {k: data['d'][k] for k in keep}
          if data['d'] == previous:
              print('匯率沒有變動'); raise SystemExit(0)
          data['updated'] = now.strftime('%Y-%m-%d %H:%M')
          data['source'] = '臺灣銀行牌告匯率・現金買入'
          json.dump(data, open(path, 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          print('目前共有', len(data['d']), '天：', keep[-6:])
          PY
      - name: 存回 rates.json
        run: bash scripts/push_generated.sh rates.json "更新臺灣銀行匯率"
