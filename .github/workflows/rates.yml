name: 臺灣銀行匯率
on:
  schedule:
    - cron: '35 8 * * 1-5'    # 週一至週五 16:35（台灣時間），臺銀收盤後
    - cron: '5 16 * * *'      # 每天 00:05（台灣時間）補抓一次
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取臺灣銀行現金買入匯率
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          TW = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(TW)
          path = 'rates.json'
          data = json.load(open(path, encoding='utf-8')) if os.path.exists(path) else {'d': {}}
          data.setdefault('d', {})
          def fetch(day):
              url = 'https://rate.bot.com.tw/xrt/flcsv/0/' + day
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              txt = urllib.request.urlopen(req, timeout=30).read().decode('utf-8-sig', 'ignore')
              out = {}
              for line in txt.splitlines()[1:]:
                  c = [x.strip() for x in line.split(',')]
                  if len(c) < 4 or len(c[0]) != 3:
                      continue
                  try:
                      v = float(c[2])          # 第 3 欄：現金匯率・本行買入
                  except ValueError:
                      continue
                  if v > 0:
                      out[c[0]] = v
              return out
          # 今天：16:00 收盤後才記錄
          days = []
          if now.weekday() < 5 and now.hour >= 16:
              days.append(now.strftime('%Y-%m-%d'))
          # 補抓前 10 天缺少的營業日
          for i in range(1, 11):
              d = now - datetime.timedelta(days=i)
              if d.weekday() < 5:
                  days.append(d.strftime('%Y-%m-%d'))
          for day in days:
              if day in data['d'] and day != now.strftime('%Y-%m-%d'):
                  continue
              try:
                  r = fetch(day)
              except Exception as e:
                  print('skip', day, e)
                  continue
              if r:
                  data['d'][day] = r
                  print('ok', day, r.get('USD'))
          keep = sorted(data['d'])[-400:]
          data['d'] = {k: data['d'][k] for k in keep}
          data['updated'] = now.strftime('%Y-%m-%d %H:%M')
          data['source'] = '臺灣銀行牌告匯率・現金買入'
          json.dump(data, open(path, 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          PY
      - name: 存回 rates.json
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "更新臺灣銀行匯率"
          git push
